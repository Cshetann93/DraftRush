<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Post Graphic Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #111317;
      color: white;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    canvas {
      width: 600px;
      height: 600px;
      max-width: 100%;
      border: 4px solid #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    button {
      background: #FFE600;
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 900;
      padding: 14px 28px;
      border: 3px solid #000;
      box-shadow: 4px 4px 0px #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="liCanvas" width="1200" height="1200"></canvas>
  <button onclick="downloadGraphic()">Download 1200x1200px PNG</button>

  <script>
    const canvas = document.getElementById('liCanvas');
    const ctx = canvas.getContext('2d');

    function draw() {
      // Base canvas
      ctx.fillStyle = '#E2E4E9';
      ctx.fillRect(0, 0, 1200, 1200);

      // Outer frame
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 16;
      ctx.strokeRect(0, 0, 1200, 1200);

      function drawBox(x, y, w, h, fill, border = '#000000', borderWidth = 4, shadow = 10) {
        if (shadow > 0) {
          ctx.fillStyle = '#000000';
          ctx.fillRect(x + shadow, y + shadow, w, h);
        }
        ctx.fillStyle = fill;
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = border;
        ctx.lineWidth = borderWidth;
        ctx.strokeRect(x, y, w, h);
      }

      // Top Header Bar
      drawBox(80, 80, 360, 56, '#000000', '#000000', 0, 0);
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(112, 108, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 20px "Space Grotesk", sans-serif';
      ctx.fillText('CONTENT BOTTLENECK', 135, 115);

      ctx.fillStyle = '#000000';
      ctx.font = '700 24px "JetBrains Mono", monospace';
      ctx.fillText('draftsrush.com', 930, 116);

      // Main Hero Card
      drawBox(80, 180, 1040, 290, '#FFE600', '#000000', 6, 14);
      ctx.fillStyle = '#000000';
      ctx.font = '900 52px "Space Grotesk", sans-serif';
      ctx.fillText('You have the industry insight.', 130, 270);
      ctx.fillText('You lack the script direction.', 130, 340);

      ctx.font = '600 24px "Inter", sans-serif';
      ctx.fillStyle = '#111317';
      ctx.fillText('Turning raw knowledge into high-retention video blueprints', 130, 410);

      // The 3 Step Framework Cards
      const steps = [
        {
          num: '01',
          tag: 'THE GAP',
          title: 'Unstructured Thoughts',
          desc: 'Bullet points on a notepad do not translate to visual timing. Editors guess the B-roll, pacing drops, and watch time dies.',
          bg: '#FFFFFF'
        },
        {
          num: '02',
          tag: 'THE FIX',
          title: 'Dual-Column AV Architecture',
          desc: 'We map timed spoken voiceover directly against exact on-screen graphics, text hooks, and punch cues.',
          bg: '#FFF6CF'
        },
        {
          num: '03',
          tag: 'THE TEST',
          title: '24-Hour Working Demo',
          desc: 'Send 1 topic. We draft your opening hook and narrative setup so you can review delivery before ordering a full package.',
          bg: '#D6E4EE'
        }
      ];

      steps.forEach((s, idx) => {
        const yPos = 510 + (idx * 175);
        drawBox(80, yPos, 1040, 145, s.bg, '#000000', 4, 8);

        // Step number badge
        drawBox(115, yPos + 35, 75, 75, '#000000', '#000000', 0, 0);
        ctx.fillStyle = '#FFE600';
        ctx.font = '900 34px "Space Grotesk", sans-serif';
        ctx.fillText(s.num, 132, yPos + 85);

        // Text content
        ctx.fillStyle = '#000000';
        ctx.font = '900 26px "Space Grotesk", sans-serif';
        ctx.fillText(s.title, 215, yPos + 60);

        ctx.fillStyle = '#333333';
        ctx.font = '500 20px "Inter", sans-serif';
        wrapText(ctx, s.desc, 215, yPos + 95, 870, 28);
      });

      // Bottom Action Strip
      drawBox(80, 1060, 1040, 75, '#000000', '#000000', 0, 0);
      ctx.fillStyle = '#FFE600';
      ctx.font = '900 24px "Space Grotesk", sans-serif';
      ctx.fillText('DM "DEMO" TO TURN 1 IDEA INTO A PRODUCTION SCRIPT', 120, 1106);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 20px "JetBrains Mono", monospace';
      ctx.fillText('DRAFTSRUSH STUDIO', 900, 1105);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    document.fonts.ready.then(draw);

    function downloadGraphic() {
      const link = document.createElement('a');
      link.download = 'draftsrush-linkedin-direction.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
