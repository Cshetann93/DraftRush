<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DraftsRush - Cinematography Infographics Reel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111317;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header-panel {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      color: #FFE600;
      font-size: 28px;
      margin-bottom: 8px;
    }
    p {
      color: #D6E4EE;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .btn-zip {
      background: #FFE600;
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 16px;
      padding: 12px 24px;
      border: 3px solid #000;
      box-shadow: 4px 4px 0px #fff;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.1s;
    }
    .btn-zip:hover { transform: translate(-2px, -2px); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1400px;
      width: 100%;
    }
    .card {
      background: #1C1F26;
      border: 2px solid #333;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 16;
      border: 2px solid #000;
      margin-bottom: 12px;
      background: #E2E4E9;
    }
    .btn-single {
      background: #D6E4EE;
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 13px;
      padding: 8px 12px;
      border: 2px solid #000;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
    }
    .btn-single:hover { background: #FFE600; }
  </style>
</head>
<body>

  <div class="header-panel">
    <h1>Cinematography Infographics Reel (1080x1920)</h1>
    <p>Enhanced Visual Blueprints with Emoji Annotations and Spatial Geometry</p>
    <button class="btn-zip" onclick="downloadAll()">Download All 8 PNGs (.ZIP)</button>
  </div>

  <div class="grid" id="gridContainer"></div>

  <script>
    const rulesData = [
      {
        type: "intro",
        badge: "🎥 CINEMATOGRAPHY PROTOCOL",
        title1: "TOP 6 RULES",
        title2: "OF CAMERA",
        deck: "Every angle change alters how the viewer subconsciously judges your subject. When framing is arbitrary, visual storytelling dies.",
        subDeck: "6 essential geometric camera rules broken down with detailed diagram blueprints and exact script use cases."
      },
      {
        type: "rule",
        num: "01",
        emoji: "🔄",
        ruleName: "THE 180° RULE",
        tag: "SPATIAL CONTINUITY",
        bg: "#E2E4E9",
        accentCard: "#FFF6CF",
        diagramType: "180degree",
        situation: "Two characters facing each other in conversation.",
        impact: "Draws an imaginary axis between characters. Keeping cameras on one side preserves screen direction. Crossing it makes actors appear to face the wrong way.",
        scriptCue: "In dual-column notes, label setups as 'Cam A (Host Profile) / Cam B (Guest Match)' to prevent crossed lines in the edit."
      },
      {
        type: "rule",
        num: "02",
        emoji: "📐",
        ruleName: "LOW VS HIGH ANGLE",
        tag: "POWER DYNAMICS",
        bg: "#D6E4EE",
        accentCard: "#FFFFFF",
        diagramType: "angles",
        situation: "Confrontations, negotiations, villains, or helpless victims.",
        impact: "Shooting upward from below makes subjects appear dominant, menacing, or heroic. Shooting downward from above shrinks them into vulnerable or trapped positions.",
        scriptCue: "Add '[LOW ANGLE - 35mm PUSH]' when a protagonist takes charge, or '[HIGH ANGLE - CRANE DOWN]' to highlight defeat."
      },
      {
        type: "rule",
        num: "03",
        emoji: "🌪️",
        ruleName: "THE DUTCH ANGLE",
        tag: "PSYCHOLOGICAL UNREST",
        bg: "#E2E4E9",
        accentCard: "#FFF1F2",
        diagramType: "dutch",
        situation: "Panic, intoxication, disorientation, or narrative deception.",
        impact: "Tilting the camera 15 to 30 degrees off the horizontal axis strips stability from the room, making viewers feel instinctively uncomfortable or suspicious.",
        scriptCue: "Use '[CANTED ANGLE / DUTCH ROLL]' right before an unexpected plot twist or during a psychological breakdown."
      },
      {
        type: "rule",
        num: "04",
        emoji: "🔲",
        ruleName: "THIRDS & EYE-LINE",
        tag: "COMPOSITIONAL BALANCE",
        bg: "#CCD0DC",
        accentCard: "#FFFFFF",
        diagramType: "thirds",
        situation: "Standard dialogue scenes, interviews, and documentary setups.",
        impact: "Splits the screen into a 3x3 grid. Placing eyes along the top horizontal third creates natural visual comfort. Centering works for tension, but thirds keep flow.",
        scriptCue: "Note '[FRAMED STAGE LEFT - THIRDS]' so editors have dedicated negative space to pop up on-screen data or hook graphics."
      },
      {
        type: "rule",
        num: "05",
        emoji: "🏃",
        ruleName: "LEAD ROOM SPACE",
        tag: "ACTION DIRECTION",
        bg: "#FFF6CF",
        accentCard: "#D6E4EE",
        diagramType: "leadroom",
        situation: "Moving subjects, walking shots, or driving sequences.",
        impact: "Leave open frame space in the direction the subject is looking or walking. Framing someone right against the edge feels suffocated unless that panic is intentional.",
        scriptCue: "Write '[TRACKING - GENEROUS LEAD ROOM]' for purposeful journeys, or '[NOSE TO BORDER]' when a character is backed into a corner."
      },
      {
        type: "rule",
        num: "06",
        emoji: "🗣️",
        ruleName: "DIRTY O.T.S.",
        tag: "INTIMACY & PROXIMITY",
        bg: "#D6E4EE",
        accentCard: "#FFFFFF",
        diagramType: "ots",
        situation: "Intense one-on-one arguments, romance, or interrogations.",
        impact: "Including a slice of the foreground character's shoulder or hair ties the two actors into a shared tangible space, forcing the audience into the conversation.",
        scriptCue: "Use '[DIRTY OTS - TIGHT ON EYES]' to raise emotional tension without cutting away to an isolated, lonely single."
      },
      {
        type: "cta",
        badge: "🎬 PRODUCTION MASTERCLASS",
        title: "WANT THE FULL BLUEPRINT?",
        deck: "Cinematography only works when your script maps every lens, angle, and cut before the crew arrives on set.",
        boxTitle: "DIRECT SCRIPT INTAKE & ADVICE",
        boxText: "DM us 'COURSE' on Instagram for our private production guides and shot-planning decks, or book a custom video script at draftsrush.com.",
        btn1: "📩 DM 'COURSE' ON INSTAGRAM",
        btn2: "🌐 VISIT DRAFTSRUSH.COM"
      }
    ];

    const container = document.getElementById('gridContainer');
    const canvases = [];

    function drawBrutalBox(ctx, x, y, w, h, fill, border = '#000000', borderWidth = 8, shadow = 16) {
      if (shadow > 0) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(x + shadow, y + shadow, w, h);
      }
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = border;
      ctx.lineWidth = borderWidth;
      ctx.strokeRect(x, y, w, h);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    // Build DOM elements
    rulesData.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'card';

      const canvas = document.createElement('canvas');
      canvas.width = 1080;
      canvas.height = 1920;
      canvas.id = `canvas-${idx}`;
      card.appendChild(canvas);

      const btn = document.createElement('button');
      btn.className = 'btn-single';
      btn.innerText = idx === 0 ? 'Download Title Card PNG' : (idx === 7 ? 'Download CTA Frame PNG' : `Download Rule 0${idx} PNG`);
      btn.onclick = () => downloadSingle(canvas, idx === 0 ? 'cinematography-00-intro.png' : (idx === 7 ? 'cinematography-07-cta.png' : `cinematography-0${idx}-rule.png`));
      card.appendChild(btn);

      container.appendChild(card);
      canvases.push(canvas);
    });

    // Custom Infographic Vector Drawers
    function drawDiagram(ctx, type, x, y, w, h) {
      ctx.save();
      // Graphic viewport box
      drawBrutalBox(ctx, x, y, w, h, '#FFFFFF', '#000000', 8, 14);

      const cx = x + w / 2;
      const cy = y + h / 2;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (type === "180degree") {
        // Red dashed line of action
        ctx.strokeStyle = '#EF4444';
        ctx.lineWidth = 6;
        ctx.setLineDash([12, 12]);
        ctx.beginPath();
        ctx.moveTo(x + 60, cy - 20);
        ctx.lineTo(x + w - 60, cy - 20);
        ctx.stroke();
        ctx.setLineDash([]);
        
        ctx.fillStyle = '#EF4444';
        ctx.font = '800 18px "JetBrains Mono", monospace';
        ctx.fillText('THE AXIS OF ACTION', cx, cy - 40);

        // Subjects (Bird's eye view emojis)
        ctx.font = '75px sans-serif';
        ctx.fillText('🙎‍♂️', cx - 180, cy - 20);
        ctx.fillText('👱‍♀️', cx + 180, cy - 20);

        // Safe Arc (Green 180-deg zone)
        ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
        ctx.beginPath();
        ctx.arc(cx, cy - 20, 160, 0, Math.PI, false);
        ctx.fill();
        
        ctx.strokeStyle = '#10B981';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(cx, cy - 20, 160, 0, Math.PI, false);
        ctx.stroke();

        // Cameras
        ctx.font = '55px sans-serif';
        // Safe Cameras
        ctx.fillText('🎥✅', cx - 120, cy + 90);
        ctx.fillText('🎥✅', cx + 120, cy + 90);
        
        // Crossed Camera (Forbidden)
        ctx.globalAlpha = 0.6;
        ctx.fillText('🎥❌', cx - 80, cy - 130);
        ctx.globalAlpha = 1.0;

        // Label
        drawBrutalBox(ctx, cx - 160, cy + 155, 320, 45, '#10B981', '#000', 4, 4);
        ctx.fillStyle = '#000000';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('SAFE CAMERA ZONE', cx, cy + 179);

      } else if (type === "angles") {
        
        // Divider
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(cx, y + 20);
        ctx.lineTo(cx, y + h - 20);
        ctx.stroke();

        // LEFT: Low Angle (Power)
        ctx.font = '60px sans-serif';
        ctx.fillText('🎥', x + 100, cy + 100); // Cam low
        
        // Arrow pointing UP
        ctx.strokeStyle = '#3B82F6';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(x + 130, cy + 60);
        ctx.lineTo(x + 220, cy - 50);
        ctx.stroke();
        // Arrowhead
        ctx.fillStyle = '#3B82F6';
        ctx.beginPath(); ctx.moveTo(x + 230, cy - 60); ctx.lineTo(x + 200, cy - 60); ctx.lineTo(x + 220, cy - 25); ctx.fill();

        // Huge powerful subject
        ctx.font = '120px sans-serif';
        ctx.fillText('🦸‍♂️', x + 280, cy - 50);
        ctx.font = '40px sans-serif';
        ctx.fillText('👑', x + 280, cy - 120);
        
        drawBrutalBox(ctx, x + 60, cy + 160, 280, 45, '#3B82F6', '#000', 4, 4);
        ctx.fillStyle = '#FFF';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('LOW ANGLE = POWER', x + 200, cy + 184);

        // RIGHT: High Angle (Vulnerable)
        ctx.font = '60px sans-serif';
        ctx.fillText('🎥', x + w - 100, cy - 100); // Cam High
        
        // Arrow pointing DOWN
        ctx.strokeStyle = '#EF4444';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(x + w - 130, cy - 60);
        ctx.lineTo(cx + 120, cy + 50);
        ctx.stroke();
        // Arrowhead
        ctx.fillStyle = '#EF4444';
        ctx.beginPath(); ctx.moveTo(cx + 110, cy + 60); ctx.lineTo(cx + 140, cy + 60); ctx.lineTo(cx + 120, cy + 25); ctx.fill();

        // Tiny vulnerable subject
        ctx.font = '60px sans-serif';
        ctx.fillText('🙍‍♂️', cx + 100, cy + 90);
        ctx.font = '30px sans-serif';
        ctx.fillText('😰', cx + 100, cy + 30);

        drawBrutalBox(ctx, cx + 40, cy + 160, 310, 45, '#EF4444', '#000', 4, 4);
        ctx.fillStyle = '#FFF';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('HIGH ANGLE = WEAKNESS', cx + 195, cy + 184);

      } else if (type === "dutch") {
        
        // Straight horizon line (Background context)
        ctx.strokeStyle = '#CBD5E1';
        ctx.lineWidth = 4;
        ctx.setLineDash([15, 15]);
        ctx.beginPath(); ctx.moveTo(x + 50, cy); ctx.lineTo(x + w - 50, cy); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#94A3B8';
        ctx.font = '800 16px "JetBrains Mono", monospace';
        ctx.fillText('NORMAL HORIZON', cx, cy - 20);

        // Tilted Camera Frame
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-22 * Math.PI / 180);

        ctx.fillStyle = 'rgba(251, 113, 133, 0.15)'; // Pink tint
        ctx.fillRect(-220, -120, 440, 240);
        
        ctx.strokeStyle = '#FB7185';
        ctx.lineWidth = 8;
        ctx.strokeRect(-220, -120, 440, 240);

        // Dizzy subject
        ctx.font = '110px sans-serif';
        ctx.fillText('😵‍💫', 0, 10);
        
        // Swirls
        ctx.font = '50px sans-serif';
        ctx.fillText('🌪️', -120, -30);
        ctx.fillText('❓', 120, 40);

        drawBrutalBox(ctx, -140, 135, 280, 40, '#FB7185', '#000', 3, 3);
        ctx.fillStyle = '#FFF';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('CANTED / DUTCH TILT', 0, 157);

        ctx.restore();

        // Angle indicator curve
        ctx.strokeStyle = '#FB7185';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(x + 120, cy, 60, -22 * Math.PI / 180, 0);
        ctx.stroke();
        ctx.fillStyle = '#FB7185';
        ctx.font = '900 22px "Space Grotesk", sans-serif';
        ctx.fillText('22°', x + 210, cy - 15);

      } else if (type === "thirds") {
        const tw = (w - 100) / 3;
        const th = (h - 80) / 3;
        const gx = x + 50;
        const gy = y + 40;

        // Draw Image Box placeholder
        ctx.fillStyle = '#F8FAFC';
        ctx.fillRect(gx, gy, tw * 3, th * 3);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 6;
        ctx.strokeRect(gx, gy, tw * 3, th * 3);

        // Rule of Thirds Grid
        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(gx + tw, gy); ctx.lineTo(gx + tw, gy + th * 3);
        ctx.moveTo(gx + tw * 2, gy); ctx.lineTo(gx + tw * 2, gy + th * 3);
        ctx.moveTo(gx, gy + th); ctx.lineTo(gx + tw * 3, gy + th);
        ctx.moveTo(gx, gy + th * 2); ctx.lineTo(gx + tw * 3, gy + th * 2);
        ctx.stroke();

        // 4 Intersections Points
        ctx.fillStyle = '#38BDF8'; // Light Blue
        const points = [
          [gx + tw, gy + th], [gx + tw * 2, gy + th],
          [gx + tw, gy + th * 2], [gx + tw * 2, gy + th * 2]
        ];
        points.forEach(([px, py]) => {
          ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
        });

        // Anchor the subject to Top-Right Third
        ctx.font = '90px sans-serif';
        ctx.fillText('👩', gx + tw * 2, gy + th);
        ctx.font = '40px sans-serif';
        ctx.fillText('🎯', gx + tw * 2 + 50, gy + th - 40);

        // Tag
        drawBrutalBox(ctx, cx - 180, y + h - 25, 360, 45, '#FFE600', '#000', 4, 4);
        ctx.fillStyle = '#000';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('EYE-LINE ANCHORED ON GRID', cx, y + h - 1);

      } else if (type === "leadroom") {
        
        // The Frame
        const fw = w - 100;
        const fh = h - 120;
        const fx = x + 50;
        const fy = y + 40;
        ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.strokeRect(fx, fy, fw, fh);

        // Subject looking right (Positioned Left)
        ctx.font = '120px sans-serif';
        ctx.fillText('🚶‍♂️', fx + 100, fy + fh / 2 + 20);
        ctx.font = '50px sans-serif';
        ctx.fillText('👀', fx + 100, fy + fh / 2 - 70);

        // Huge Arrow defining Lead Room
        ctx.strokeStyle = '#10B981';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(fx + 180, fy + fh / 2 - 20);
        ctx.lineTo(fx + fw - 80, fy + fh / 2 - 20);
        ctx.stroke();
        
        // Arrow head
        ctx.fillStyle = '#10B981';
        ctx.beginPath();
        ctx.moveTo(fx + fw - 60, fy + fh / 2 - 20);
        ctx.lineTo(fx + fw - 100, fy + fh / 2 - 50);
        ctx.lineTo(fx + fw - 100, fy + fh / 2 + 10);
        ctx.fill();

        // Label inside the lead room
        ctx.fillStyle = '#10B981';
        ctx.font = '800 22px "JetBrains Mono", monospace';
        ctx.fillText('NEGATIVE SPACE (LEAD)', fx + 360, fy + fh / 2 - 60);

        // Tiny BAD example box at the bottom
        drawBrutalBox(ctx, cx - 180, y + h - 60, 360, 50, '#EF4444', '#000', 4, 4);
        ctx.fillStyle = '#FFF';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('BAD: 🛑🚶‍♂️ (NO ROOM TO MOVE)', cx, y + h - 33);

      } else if (type === "ots") {
        
        // Framing Box
        const fw = w - 80; const fh = h - 100;
        const fx = x + 40; const fy = y + 40;
        ctx.fillStyle = '#F8FAFC'; ctx.fillRect(fx, fy, fw, fh);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.strokeRect(fx, fy, fw, fh);

        // FOREGROUND SHOULDER (Huge, Dark, Left Side)
        ctx.font = '320px sans-serif';
        ctx.fillStyle = '#334155'; // Dark slate
        ctx.fillText('👤', fx + 80, fy + fh);
        
        drawBrutalBox(ctx, fx + 20, fy + fh - 40, 160, 35, '#334155', '#000', 3, 0);
        ctx.fillStyle = '#FFF';
        ctx.font = '900 14px "Space Grotesk", sans-serif';
        ctx.fillText('FOREGROUND', fx + 100, fy + fh - 21);

        // BACKGROUND SUBJECT (Focused, Right Side)
        ctx.font = '140px sans-serif';
        ctx.fillText('👱‍♀️', fx + fw - 140, fy + fh / 2 + 40);

        drawBrutalBox(ctx, fx + fw - 210, fy + fh / 2 + 100, 140, 35, '#FFE600', '#000', 3, 0);
        ctx.fillStyle = '#000';
        ctx.font = '900 14px "Space Grotesk", sans-serif';
        ctx.fillText('FOCUS (GUEST)', fx + fw - 140, fy + fh / 2 + 119);

        // Connection Line
        ctx.strokeStyle = '#3B82F6';
        ctx.lineWidth = 6;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(fx + 220, fy + fh / 2);
        ctx.lineTo(fx + fw - 220, fy + fh / 2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = '40px sans-serif';
        ctx.fillText('👁️', fx + 200, fy + fh / 2 - 30);
        ctx.fillText('👁️', fx + fw - 210, fy + fh / 2 - 30);

        // Tag
        drawBrutalBox(ctx, cx - 180, y + h - 40, 360, 45, '#3B82F6', '#000', 4, 4);
        ctx.fillStyle = '#FFF';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('SHARED SPATIAL TENSION', cx, y + h - 17);
      }

      ctx.restore();
    }

    function renderAll() {
      rulesData.forEach((data, idx) => {
        const canvas = canvases[idx];
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'alphabetic'; // Reset for standard text

        if (data.type === "intro") {
          // Slide 0: High-Impact Intro Card
          ctx.fillStyle = '#FFE600';
          ctx.fillRect(0, 0, 1080, 1920);
          ctx.lineWidth = 24;
          ctx.strokeStyle = '#000000';
          ctx.strokeRect(0, 0, 1080, 1920);

          drawBrutalBox(ctx, 90, 130, 560, 75, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 24px "Space Grotesk", sans-serif';
          ctx.fillText(data.badge, 120, 178);

          ctx.fillStyle = '#000000';
          ctx.font = '900 32px "JetBrains Mono", monospace';
          ctx.fillText('01 / 08', 860, 176);

          drawBrutalBox(ctx, 90, 250, 900, 1360, '#FFFFFF', '#000000', 10, 24);

          drawBrutalBox(ctx, 140, 320, 800, 180, '#FB7185', '#000000', 8, 14);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 105px "Space Grotesk", sans-serif';
          ctx.fillText(data.title1, 180, 450);

          drawBrutalBox(ctx, 140, 530, 800, 180, '#FFE600', '#000000', 8, 14);
          ctx.fillStyle = '#000000';
          ctx.font = '900 100px "Space Grotesk", sans-serif';
          ctx.fillText(data.title2, 210, 660);

          ctx.fillStyle = '#111317';
          ctx.font = '700 36px "Inter", sans-serif';
          wrapText(ctx, data.deck, 140, 800, 800, 52);

          drawBrutalBox(ctx, 140, 1040, 800, 260, '#D6E4EE', '#000000', 6, 12);
          ctx.fillStyle = '#000000';
          ctx.font = '900 26px "Space Grotesk", sans-serif';
          ctx.fillText('WHY AMATEUR VIDEOS FEEL FLAT 📉', 180, 1105);

          ctx.fillStyle = '#222222';
          ctx.font = '600 28px "Inter", sans-serif';
          wrapText(ctx, data.subDeck, 180, 1165, 720, 42);

          drawBrutalBox(ctx, 90, 1660, 900, 120, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#FFE600';
          ctx.font = '900 32px "Space Grotesk", sans-serif';
          ctx.fillText('SWIPE FOR 6 CAMERA BLUEPRINTS', 140, 1735);
          ctx.fillText('→', 930, 1735);

        } else if (data.type === "rule") {
          // Rule Cards
          ctx.fillStyle = data.bg;
          ctx.fillRect(0, 0, 1080, 1920);
          ctx.lineWidth = 24;
          ctx.strokeStyle = '#000000';
          ctx.strokeRect(0, 0, 1080, 1920);

          drawBrutalBox(ctx, 90, 80, 520, 68, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#FFE600';
          ctx.font = '900 24px "Space Grotesk", sans-serif';
          ctx.fillText(`RULE ${data.num} • ${data.tag}`, 115, 122);

          drawBrutalBox(ctx, 840, 80, 150, 68, '#FFFFFF', '#000000', 4, 6);
          ctx.fillStyle = '#000000';
          ctx.font = '900 28px "JetBrains Mono", monospace';
          ctx.fillText(`0${idx + 1}/08`, 865, 124);

          drawBrutalBox(ctx, 90, 175, 900, 130, '#FFFFFF', '#000000', 8, 14);
          ctx.fillStyle = '#000000';
          ctx.font = '900 46px "Space Grotesk", sans-serif';
          ctx.fillText(`${data.emoji} ${data.ruleName}`, 120, 258);

          // DIAGRAM (Calls external function)
          drawDiagram(ctx, data.diagramType, 90, 335, 900, 480);
          ctx.textBaseline = 'alphabetic'; // Reset

          // WHEN TO USE IT
          drawBrutalBox(ctx, 90, 850, 900, 220, data.accentCard, '#000000', 8, 14);
          drawBrutalBox(ctx, 130, 885, 290, 45, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#FFE600';
          ctx.font = '900 22px "Space Grotesk", sans-serif';
          ctx.fillText('📌 BEST USE CASE', 150, 916);

          ctx.fillStyle = '#111317';
          ctx.font = '800 32px "Inter", sans-serif';
          wrapText(ctx, data.situation, 130, 980, 820, 44);

          // PSYCHOLOGICAL IMPACT
          drawBrutalBox(ctx, 90, 1105, 900, 360, '#FFFFFF', '#000000', 8, 14);
          drawBrutalBox(ctx, 130, 1140, 370, 45, '#FB7185', '#000000', 0, 0);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 22px "Space Grotesk", sans-serif';
          ctx.fillText('🧠 ON-SCREEN PSYCHOLOGY', 150, 1171);

          ctx.fillStyle = '#111317';
          ctx.font = '600 30px "Inter", sans-serif';
          wrapText(ctx, data.impact, 130, 1235, 820, 46);

          // SCRIPT BLUEPRINT CUE
          drawBrutalBox(ctx, 90, 1500, 900, 240, '#FFE600', '#000000', 8, 14);
          drawBrutalBox(ctx, 130, 1535, 360, 45, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#34D399';
          ctx.font = '900 22px "Space Grotesk", sans-serif';
          ctx.fillText('✍️ HOW TO SCRIPT IT (AV)', 150, 1566);

          ctx.fillStyle = '#000000';
          ctx.font = '700 27px "Inter", sans-serif';
          wrapText(ctx, data.scriptCue, 130, 1625, 820, 38);

          // Footer
          ctx.fillStyle = '#000000';
          ctx.font = '800 28px "Space Grotesk", sans-serif';
          ctx.fillText('DRAFTSRUSH STUDIO', 90, 1820);
          ctx.font = '700 26px "JetBrains Mono", monospace';
          ctx.fillText('draftsrush.com', 720, 1820);

        } else if (data.type === "cta") {
          // Slide 8: Closing CTA Conversion Card
          ctx.fillStyle = '#FFE600';
          ctx.fillRect(0, 0, 1080, 1920);
          ctx.lineWidth = 24;
          ctx.strokeStyle = '#000000';
          ctx.strokeRect(0, 0, 1080, 1920);

          drawBrutalBox(ctx, 90, 120, 480, 75, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 24px "Space Grotesk", sans-serif';
          ctx.fillText(data.badge, 120, 166);

          ctx.fillStyle = '#000000';
          ctx.font = '900 32px "JetBrains Mono", monospace';
          ctx.fillText('08 / 08', 860, 166);

          drawBrutalBox(ctx, 90, 240, 900, 1280, '#FFFFFF', '#000000', 10, 24);

          ctx.fillStyle = '#000000';
          ctx.font = '900 78px "Space Grotesk", sans-serif';
          ctx.fillText('STOP SHOOTING', 150, 380);

          drawBrutalBox(ctx, 140, 420, 720, 95, '#FB7185', '#000000', 0, 0);
          ctx.fillStyle = '#FFFFFF';
          ctx.fillText('RANDOM ANGLES.', 160, 492);

          ctx.fillStyle = '#111317';
          ctx.font = '600 36px "Inter", sans-serif';
          wrapText(ctx, data.deck, 150, 590, 780, 54);

          drawBrutalBox(ctx, 150, 820, 780, 310, '#D6E4EE', '#000000', 6, 12);
          ctx.fillStyle = '#000000';
          ctx.font = '900 34px "Space Grotesk", sans-serif';
          ctx.fillText(data.boxTitle, 190, 890);

          ctx.fillStyle = '#222222';
          ctx.font = '600 28px "Inter", sans-serif';
          wrapText(ctx, data.boxText, 190, 950, 700, 42);

          drawBrutalBox(ctx, 150, 1180, 780, 110, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#34D399';
          ctx.font = '900 36px "Space Grotesk", sans-serif';
          ctx.fillText(data.btn1, 180, 1250);

          drawBrutalBox(ctx, 150, 1320, 780, 110, '#FFE600', '#000000', 6, 8);
          ctx.fillStyle = '#000000';
          ctx.font = '900 36px "Space Grotesk", sans-serif';
          ctx.fillText(data.btn2, 240, 1390);

          ctx.fillStyle = '#000000';
          ctx.font = '800 32px "Space Grotesk", sans-serif';
          ctx.fillText('DRAFTSRUSH STUDIO • 2026', 90, 1780);
        }
      });
    }

    function downloadSingle(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    async function downloadAll() {
      const zip = new JSZip();
      canvases.forEach((canvas, idx) => {
        const dataUrl = canvas.toDataURL('image/png');
        const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
        const filename = idx === 0 ? 'cinematography-00-intro.png' : (idx === 7 ? 'cinematography-07-cta.png' : `cinematography-0${idx}-rule.png`);
        zip.file(filename, base64Data, { base64: true });
      });

      const content = await zip.generateAsync({ type: "blob" });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = "draftsrush-cinematography-infographics-reel.zip";
      link.click();
    }

    // Delay render slightly to ensure fonts load completely
    document.fonts.ready.then(() => setTimeout(renderAll, 100));
  </script>
