<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DraftsRush - Animated Reel Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111317;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      color: #FFE600;
      font-size: 26px;
      margin-bottom: 6px;
    }
    p {
      color: #D6E4EE;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    button {
      background: #FFE600;
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 15px;
      padding: 12px 24px;
      border: 3px solid #000;
      box-shadow: 4px 4px 0px #fff;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.1s;
    }
    button:hover { transform: translate(-2px, -2px); }
    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
      box-shadow: none;
    }
    .status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #34D399;
      margin-bottom: 12px;
      min-height: 20px;
    }
    canvas {
      width: 100%;
      max-width: 360px;
      height: auto;
      aspect-ratio: 9 / 16;
      border: 3px solid #FFE600;
      background: #111317;
      box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>DraftsRush Animated Reel Engine</h1>
    <p>Live Typewriter + Sliding Blocks + Real-time In-Browser Video Export</p>
  </div>

  <div class="controls">
    <button id="btnPlay" onclick="restartAnimation()">▶ Play Preview</button>
    <button id="btnRecord" onclick="startRecording()">🔴 Record Video File</button>
  </div>

  <div class="status" id="statusText">Ready to preview or record.</div>

  <canvas id="reelCanvas" width="1080" height="1920"></canvas>

  <script>
    const canvas = document.getElementById('reelCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const btnPlay = document.getElementById('btnPlay');
    const btnRecord = document.getElementById('btnRecord');

    const TOTAL_DURATION = 15; // 15 seconds Reel
    let startTime = null;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];

    // Helper: Draw Neo-Brutalist Box
    function drawBox(x, y, w, h, fill, border = '#000000', borderWidth = 8, shadow = 16) {
      if (shadow > 0) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(x + shadow, y + shadow, w, h);
      }
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = border;
      ctx.lineWidth = borderWidth;
      ctx.strokeRect(x, y, w, h);
    }

    // Helper: Text Wrap
    function wrapText(text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    // Easing Functions
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function renderFrame(time) {
      // Background base
      ctx.fillStyle = '#111317';
      ctx.fillRect(0, 0, 1080, 1920);

      // Outer Frame
      ctx.lineWidth = 24;
      ctx.strokeStyle = '#FFE600';
      ctx.strokeRect(0, 0, 1080, 1920);

      // Persistent Top Brand Bar
      drawBox(90, 80, 480, 68, '#FFE600', '#000000', 0, 0);
      ctx.fillStyle = '#000000';
      ctx.font = '900 24px "Space Grotesk", sans-serif';
      ctx.fillText('DRAFTSRUSH PROTOCOL', 120, 122);

      // Timecode counter
      const secondsLeft = Math.max(0, TOTAL_DURATION - time).toFixed(1);
      drawBox(840, 80, 150, 68, '#FFFFFF', '#000000', 4, 6);
      ctx.fillStyle = '#000000';
      ctx.font = '900 24px "JetBrains Mono", monospace';
      ctx.fillText(`00:${secondsLeft < 10 ? '0' : ''}${Math.ceil(secondsLeft)}`, 865, 122);

      // ==========================================
      // SCENE 1: 0.0s to 4.5s (The Hook & Slip-In Box)
      // ==========================================
      if (time < 4.5) {
        // Block 1 slides from LEFT
        const t1 = Math.min(1, Math.max(0, (time - 0.2) / 0.6));
        const x1 = -900 + (easeOutBack(t1) * 990);
        drawBox(x1, 240, 900, 220, '#FB7185', '#000000', 8, 16);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 78px "Space Grotesk", sans-serif';
        ctx.fillText('STOP WRITING', x1 + 60, 375);

        // Block 2 slides from RIGHT
        const t2 = Math.min(1, Math.max(0, (time - 0.6) / 0.6));
        const x2 = 1200 - (easeOutBack(t2) * 1110);
        drawBox(x2, 490, 900, 220, '#FFE600', '#000000', 8, 16);
        ctx.fillStyle = '#000000';
        ctx.font = '900 78px "Space Grotesk", sans-serif';
        ctx.fillText('LIKE AN ESSAY.', x2 + 60, 625);

        // Subcard pops in from bottom
        const t3 = Math.min(1, Math.max(0, (time - 1.2) / 0.5));
        const y3 = 1920 - (easeOutCubic(t3) * 1150);
        drawBox(90, y3, 900, 480, '#FFFFFF', '#000000', 8, 14);

        // Typewriter effect inside the white card
        if (time > 1.6) {
          const fullText = "When your script reads like a textbook, your viewer retention graph crashes before second 03.";
          const charCount = Math.floor((time - 1.6) * 32); // 32 chars per second
          const currentText = fullText.substring(0, charCount);

          ctx.fillStyle = '#111317';
          ctx.font = '700 36px "Inter", sans-serif';
          wrapText(currentText, 140, y3 + 120, 800, 56);

          // Blinking cursor
          if (Math.floor(time * 3) % 2 === 0 && charCount < fullText.length) {
            ctx.fillStyle = '#E11D48';
            ctx.fillRect(140 + ctx.measureText(currentText.split(' ').pop()).width + 10, y3 + 75, 6, 42);
          }
        }
      }

      // ==========================================
      // SCENE 2: 4.5s to 9.5s (The Dual-Column Breakdown)
      // ==========================================
      else if (time >= 4.5 && time < 9.5) {
        const sceneTime = time - 4.5;

        // Container Box Pops In
        const tc = Math.min(1, sceneTime / 0.4);
        const scale = easeOutBack(tc);
        drawBox(90, 220, 900, 1340, '#FFFFFF', '#000000', 10, 20);

        // Header Pill
        drawBox(140, 280, 440, 60, '#000000', '#000000', 0, 0);
        ctx.fillStyle = '#FFE600';
        ctx.font = '900 24px "Space Grotesk", sans-serif';
        ctx.fillText('THE DUAL-COLUMN SYSTEM', 165, 320);

        // Subtitle
        ctx.fillStyle = '#111317';
        ctx.font = '900 52px "Space Grotesk", sans-serif';
        ctx.fillText('AV FORMAT IN ACTION', 140, 410);

        // Left Column: Visual (Slides from Left)
        const tv = Math.min(1, Math.max(0, (sceneTime - 0.4) / 0.5));
        const xv = -450 + (easeOutBack(tv) * 590);
        drawBox(xv, 470, 380, 680, '#D6E4EE', '#000000', 6, 8);
        drawBox(xv + 30, 500, 200, 40, '#000000', '#000000', 0, 0);
        ctx.fillStyle = '#34D399';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('VIDEO (B-ROLL)', xv + 50, 526);

        // Right Column: Audio (Slides from Right)
        const ta = Math.min(1, Math.max(0, (sceneTime - 0.7) / 0.5));
        const xa = 1100 - (easeOutBack(ta) * 550);
        drawBox(xa, 470, 380, 680, '#FFF6CF', '#000000', 6, 8);
        drawBox(xa + 30, 500, 200, 40, '#000000', '#000000', 0, 0);
        ctx.fillStyle = '#E11D48';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('AUDIO (VOICEOVER)', xa + 50, 526);

        // Typewriter in Video Column
        if (sceneTime > 1.2) {
          const vText = "[FAST CUT] Rapid zoom on retention drop-off graph at 00:03.";
          const countV = Math.floor((sceneTime - 1.2) * 28);
          ctx.fillStyle = '#111317';
          ctx.font = '700 24px "JetBrains Mono", monospace';
          wrapText(vText.substring(0, countV), xv + 30, 590, 320, 36);
        }

        // Typewriter in Audio Column
        if (sceneTime > 2.0) {
          const aText = "\"If you write long sentences, your video is already dead.\"";
          const countA = Math.floor((sceneTime - 2.0) * 28);
          ctx.fillStyle = '#111317';
          ctx.font = '800 28px "Inter", sans-serif';
          wrapText(aText.substring(0, countA), xa + 30, 600, 320, 42);
        }

        // Animated Rule Badge snaps in at 3.2s
        if (sceneTime > 3.2) {
          const tb = Math.min(1, (sceneTime - 3.2) / 0.3);
          const yb = 1350 - (easeOutBack(tb) * 160);
          drawBox(140, yb, 800, 110, '#FFE600', '#000000', 6, 10);
          ctx.fillStyle = '#000000';
          ctx.font = '900 30px "Space Grotesk", sans-serif';
          ctx.fillText('RULE: 12 WORDS MAXIMUM PER LINE', 180, yb + 68);
        }
      }

      // ==========================================
      // SCENE 3: 9.5s to 15.0s (The Final CTA Conversion)
      // ==========================================
      else {
        const sceneTime = time - 9.5;

        // Cover Box expands
        drawBox(90, 220, 900, 1380, '#FFE600', '#000000', 10, 24);

        // Tag
        drawBox(140, 280, 420, 60, '#000000', '#000000', 0, 0);
        ctx.fillStyle = '#34D399';
        ctx.font = '900 22px "Space Grotesk", sans-serif';
        ctx.fillText('TEST OUR PACING FIRST', 170, 318);

        // Huge Title
        ctx.fillStyle = '#000000';
        ctx.font = '900 78px "Space Grotesk", sans-serif';
        ctx.fillText('YOU HAVE NOTES.', 140, 440);

        // Pink Box Pops In
        const tp = Math.min(1, sceneTime / 0.4);
        const xp = -800 + (easeOutBack(tp) * 940);
        drawBox(xp, 470, 800, 120, '#FB7185', '#000000', 6, 8);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 58px "Space Grotesk", sans-serif';
        ctx.fillText('WE BUILD BLUEPRINTS.', xp + 30, 550);

        // Body Typewriter
        if (sceneTime > 0.6) {
          const bodyText = "Send 1 rough topic in our DM. We will draft your opening hook in our dual-column format completely free.";
          const cCount = Math.floor((sceneTime - 0.6) * 35);
          ctx.fillStyle = '#111317';
          ctx.font = '700 36px "Inter", sans-serif';
          wrapText(bodyText.substring(0, cCount), 140, 670, 800, 54);
        }

        // Buttons Slide in from bottom
        if (sceneTime > 2.0) {
          const btnT = Math.min(1, (sceneTime - 2.0) / 0.4);
          const btnY = 1600 - (easeOutBack(btnT) * 450);

          drawBox(140, btnY, 800, 110, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#34D399';
          ctx.font = '900 34px "Space Grotesk", sans-serif';
          ctx.fillText('📩 DM "DEMO" ON INSTAGRAM', 220, btnY + 70);

          drawBox(140, btnY + 140, 800, 110, '#FFFFFF', '#000000', 6, 8);
          ctx.fillStyle = '#000000';
          ctx.font = '900 34px "Space Grotesk", sans-serif';
          ctx.fillText('🌐 VISIT DRAFTSRUSH.COM', 240, btnY + 210);
        }
      }

      // Bottom Studio Watermark
      ctx.fillStyle = '#FFE600';
      ctx.font = '800 26px "Space Grotesk", sans-serif';
      ctx.fillText('DRAFTSRUSH STUDIO • 2026', 90, 1840);
    }

    // Animation Loop
    function loop(timestamp) {
      if (!startTime) startTime = timestamp;
      const progress = (timestamp - startTime) / 1000;

      if (progress <= TOTAL_DURATION) {
        renderFrame(progress);
        requestAnimationFrame(loop);
      } else {
        renderFrame(TOTAL_DURATION);
        if (isRecording) {
          stopRecording();
        } else {
          statusText.innerText = "Preview finished. Click 'Play Preview' to replay.";
        }
      }
    }

    function restartAnimation() {
      startTime = null;
      statusText.innerText = "Playing 15s animated reel preview...";
      requestAnimationFrame(loop);
    }

    // Canvas Video Recording Pipeline
    function startRecording() {
      statusText.innerText = "Recording video... please wait 15 seconds.";
      btnPlay.disabled = true;
      btnRecord.disabled = true;
      isRecording = true;
      recordedChunks = [];

      // Stream 60FPS canvas
      const stream = canvas.captureStream(60);
      const options = { mimeType: 'video/webm;codecs=vp9' };

      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = function(event) {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = function() {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'draftsrush-animated-reel.webm';
        a.click();

        statusText.innerText = "Recording complete! Video file downloaded.";
        btnPlay.disabled = false;
        btnRecord.disabled = false;
        isRecording = false;
      };

      mediaRecorder.start();
      startTime = null;
      requestAnimationFrame(loop);
    }

    document.fonts.ready.then(() => {
      renderFrame(0);
    });
  </script>
</body>
</html>
