<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pro Reel Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&family=Playfair+Display:wght@700;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <style>
    /* Modern UI Reset & Variables */
    :root {
      --bg-dark: #0F1115;
      --bg-panel: #181B21;
      --border-color: #2A2F3A;
      --accent: #FFE600;
      --text-main: #FFFFFF;
      --text-muted: #8FA0B5;
    }
    body {
      margin: 0; padding: 0; background: var(--bg-dark); color: var(--text-main);
      font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 400px; background: var(--bg-panel); border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; height: 100vh;
    }
    .sidebar-header {
      padding: 24px; border-bottom: 1px solid var(--border-color);
    }
    .sidebar-header h1 {
      margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent);
    }
    .sidebar-header p { margin: 4px 0 0 0; font-size: 12px; color: var(--text-muted); }
    
    .sidebar-content {
      flex: 1; overflow-y: auto; padding: 16px;
    }
    .sidebar-content::-webkit-scrollbar { width: 6px; }
    .sidebar-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

    /* Accordion / Sections */
    details {
      background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; overflow: hidden;
    }
    summary {
      padding: 16px; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
      cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover { background: #1C2028; }
    details[open] summary { border-bottom: 1px solid var(--border-color); }
    .controls-grid { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* Inputs */
    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
    select, input, textarea {
      width: 100%; padding: 10px 12px; background: var(--bg-panel); border: 1px solid var(--border-color);
      color: var(--text-main); font-family: inherit; font-size: 13px; border-radius: 6px; outline: none; transition: 0.2s;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); }
    textarea { height: 100px; resize: vertical; line-height: 1.5; }
    
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }

    /* Export Button */
    .sidebar-footer { padding: 20px; border-top: 1px solid var(--border-color); background: var(--bg-panel); }
    button {
      width: 100%; padding: 16px; background: var(--accent); color: #000; font-family: 'Space Grotesk', sans-serif;
      font-size: 16px; font-weight: 800; text-transform: uppercase; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s;
    }
    button:hover { filter: brightness(1.1); transform: translateY(-2px); }
    button:active { transform: translateY(0); }

    /* Canvas Preview Area */
    .preview-area {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #1C2028 0%, #0F1115 100%); padding: 40px; overflow: hidden;
    }
    .canvas-container {
      height: 90%; aspect-ratio: 9/16; background: #000; border-radius: 12px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6); overflow: hidden; position: relative;
    }
    canvas { width: 100%; height: 100%; display: block; }

  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Reel Studio</h1>
      <p>Modular Frame Generator</p>
    </div>

    <div class="sidebar-content">
      
      <!-- 1. GLOBAL THEME -->
      <details open>
        <summary>🎨 1. Themes & Elements</summary>
        <div class="controls-grid">
          <div>
            <label>Color Master Theme (Palette)</label>
            <select id="s_theme">
              <option value="brutalist">1. DraftsRush (Yellow / White / Black)</option>
              <option value="darkmode">2. Deep Terminal (Charcoal / Green / White)</option>
              <option value="cyberpunk">3. Neon Cyber (Deep Blue / Cyan / Pink)</option>
              <option value="elegant">4. Editorial (Cream / Charcoal / Gold)</option>
              <option value="crimson">5. Danger Zone (Dark Red / White / Black)</option>
            </select>
          </div>
          <div>
            <label>Premium Background Overlay</label>
            <select id="s_overlay">
              <option value="none">1. Clean Solid</option>
              <option value="grid">2. Tech Blueprint Grid</option>
              <option value="dots">3. Halftone Dots</option>
              <option value="vignette">4. Cinematic Gradient Shadows</option>
              <option value="stripes">5. Caution Tape Margins</option>
            </select>
          </div>
        </div>
      </details>

      <!-- 2. BOX & LAYOUT -->
      <details>
        <summary>📦 2. Box Architecture</summary>
        <div class="controls-grid">
          <div>
            <label>Box Visual Style</label>
            <select id="s_boxType">
              <option value="hard_shadow">1. Brutalist Hard Shadow</option>
              <option value="soft_shadow">2. Modern Soft Drop Shadow</option>
              <option value="outline">3. Sharp Outline (No Fill)</option>
              <option value="floating">4. Split Floating Panels</option>
              <option value="glass">5. Translucent Glass Board</option>
            </select>
          </div>
          <div>
            <label>Box Size (Width)</label>
            <select id="s_boxSize">
              <option value="800">1. Narrow (800px)</option>
              <option value="880" selected>2. Standard (880px)</option>
              <option value="960">3. Wide (960px)</option>
              <option value="1020">4. Ultra Wide (1020px)</option>
              <option value="1080">5. Edge-to-Edge (1080px)</option>
            </select>
          </div>
        </div>
      </details>

      <!-- 3. TYPOGRAPHY -->
      <details>
        <summary>✍️ 3. Typography Rules</summary>
        <div class="controls-grid">
          <div class="row">
            <div>
              <label>Heading Font</label>
              <select id="s_headFont">
                <option value="Space Grotesk">1. Space Grotesk</option>
                <option value="Inter">2. Inter Bold</option>
                <option value="Playfair Display">3. Playfair Display</option>
                <option value="JetBrains Mono">4. JetBrains Mono</option>
                <option value="Outfit">5. Outfit</option>
              </select>
            </div>
            <div>
              <label>Heading Size</label>
              <select id="s_headSize">
                <option value="54">1. Small (54pt)</option>
                <option value="64" selected>2. Medium (64pt)</option>
                <option value="72">3. Large (72pt)</option>
                <option value="84">4. X-Large (84pt)</option>
                <option value="96">5. Giant (96pt)</option>
              </select>
            </div>
          </div>
          
          <div class="row">
            <div>
              <label>Body Font</label>
              <select id="s_bodyFont">
                <option value="Inter">1. Inter</option>
                <option value="Outfit">2. Outfit</option>
                <option value="JetBrains Mono">3. JetBrains Mono</option>
                <option value="Space Grotesk">4. Space Grotesk</option>
                <option value="Playfair Display">5. Playfair Display</option>
              </select>
            </div>
            <div>
              <label>Body Size</label>
              <select id="s_bodySize">
                <option value="34">1. Small (34pt)</option>
                <option value="40" selected>2. Medium (40pt)</option>
                <option value="46">3. Large (46pt)</option>
                <option value="52">4. X-Large (52pt)</option>
                <option value="60">5. Giant (60pt)</option>
              </select>
            </div>
          </div>
        </div>
      </details>

      <!-- 4. CONTENT -->
      <details open>
        <summary>📝 4. Content & Text</summary>
        <div class="controls-grid">
          <div>
            <label>Bullet Point Style</label>
            <select id="s_bullet">
              <option value="number">1. Numbers (01., 02.)</option>
              <option value="dot">2. Solid Dots (•)</option>
              <option value="dash">3. Minimal Dashes (—)</option>
              <option value="arrow">4. Arrows (➔)</option>
              <option value="plus">5. Cross Accent (+)</option>
            </select>
          </div>
          <div class="row">
            <div>
              <label>Top Badge</label>
              <input type="text" id="i_badge" value="01 / 05">
            </div>
            <div>
              <label>Category</label>
              <input type="text" id="i_cat" value="CREATOR GUIDE">
            </div>
          </div>
          <div>
            <label>Main Headline</label>
            <input type="text" id="i_title" value="Reddit Horror Stories">
          </div>
          <div>
            <label>Body Lines (Press Enter for new line)</label>
            <textarea id="i_body">Find viral stories on r/nosleep.
Overlay text on free gameplay footage.
Use CapCut for dynamic auto-captions.
High retention from readers.</textarea>
          </div>
          <div>
            <label>Footer Highlight</label>
            <input type="text" id="i_footer" value="TOOLS: Reddit + CapCut">
          </div>
        </div>
      </details>

    </div>

    <div class="sidebar-footer">
      <button id="downloadBtn">Export 1080x1920 PNG</button>
    </div>
  </div>

  <div class="preview-area">
    <div class="canvas-container">
      <canvas id="reelCanvas" width="1080" height="1920"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('reelCanvas');
    const ctx = canvas.getContext('2d');

    // Color Palettes
    const palettes = {
      brutalist: { bg: '#E2E4E9', box: '#FFFFFF', accent: '#FFE600', textHead: '#111317', textBody: '#333333', border: '#111317' },
      darkmode: { bg: '#111317', box: '#1C2028', accent: '#34D399', textHead: '#FFFFFF', textBody: '#E2E4E9', border: '#2A2F3A' },
      cyberpunk: { bg: '#090A0F', box: '#121420', accent: '#00E5FF', textHead: '#FFFFFF', textBody: '#B0C4DE', border: '#FF2A54' },
      elegant: { bg: '#F4F1EA', box: '#FFFFFF', accent: '#C8A97E', textHead: '#2C302E', textBody: '#4A4E4D', border: '#E0DCD3' },
      crimson: { bg: '#1A0F11', box: '#2D1418', accent: '#FF2A54', textHead: '#FFFFFF', textBody: '#F4F1EA', border: '#FF2A54' }
    };

    // Grab all inputs
    const inputs = [
      's_theme', 's_overlay', 's_boxType', 's_boxSize', 's_headFont', 's_headSize', 's_bodyFont', 's_bodySize', 's_bullet',
      'i_badge', 'i_cat', 'i_title', 'i_body', 'i_footer'
    ].reduce((acc, id) => { acc[id] = document.getElementById(id); return acc; }, {});

    // Word Wrap Logic
    function wrapText(text, x, y, maxWidth, lineHeight, isBody = false, bulletStyle = '', lineIndex = 0, colors) {
      const words = text.split(' ');
      let line = '';
      let firstLine = true;

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        
        if (metrics.width > maxWidth && n > 0) {
          if(isBody && firstLine) drawBullet(x, y, bulletStyle, lineIndex, colors);
          ctx.fillText(line, isBody ? x + 60 : x, y);
          line = words[n] + ' ';
          y += lineHeight;
          firstLine = false;
        } else {
          line = testLine;
        }
      }
      if(isBody && firstLine) drawBullet(x, y, bulletStyle, lineIndex, colors);
      ctx.fillText(line, isBody ? x + 60 : x, y);
      return y + lineHeight; 
    }

    // Bullet drawing logic
    function drawBullet(x, y, style, index, colors) {
      ctx.save();
      ctx.fillStyle = colors.accent;
      ctx.font = `700 ${inputs.s_bodySize.value}px "JetBrains Mono"`;
      
      let mark = '';
      if(style === 'number') mark = `0${index + 1}.`;
      else if(style === 'dot') mark = '•';
      else if(style === 'dash') mark = '—';
      else if(style === 'arrow') mark = '➔';
      else if(style === 'plus') mark = '+';

      ctx.fillText(mark, x, y);
      ctx.restore();
    }

    // Main Render Engine
    function render() {
      const p = palettes[inputs.s_theme.value];
      const boxW = parseInt(inputs.s_boxSize.value);
      const boxX = (1080 - boxW) / 2;
      const boxY = 320;
      const boxH = 1350;

      // 1. Draw Background
      ctx.fillStyle = p.bg;
      ctx.fillRect(0, 0, 1080, 1920);

      // 2. Premium Overlays
      const overlay = inputs.s_overlay.value;
      if (overlay === 'grid') {
        ctx.strokeStyle = p.border; ctx.lineWidth = 2;
        for(let i=0; i<1080; i+=60) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,1920); ctx.stroke(); }
        for(let i=0; i<1920; i+=60) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(1080,i); ctx.stroke(); }
      } 
      else if (overlay === 'dots') {
        ctx.fillStyle = p.border;
        for(let x=20; x<1080; x+=40) {
          for(let y=20; y<1920; y+=40) {
            ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
          }
        }
      }
      else if (overlay === 'vignette') {
        const grd = ctx.createRadialGradient(540, 960, 200, 540, 960, 1200);
        grd.addColorStop(0, "transparent");
        grd.addColorStop(1, p.border === '#111317' ? 'rgba(0,0,0,0.5)' : 'rgba(0,0,0,0.8)');
        ctx.fillStyle = grd; ctx.fillRect(0, 0, 1080, 1920);
      }
      else if (overlay === 'stripes') {
        ctx.fillStyle = p.accent;
        ctx.fillRect(0, 0, 1080, 40);
        ctx.fillRect(0, 1880, 1080, 40);
      }

      // 3. Box Rendering
      const boxStyle = inputs.s_boxType.value;
      
      // Box Reset
      ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

      if (boxStyle === 'hard_shadow') {
        ctx.fillStyle = p.textHead;
        ctx.fillRect(boxX + 16, boxY + 16, boxW, boxH);
        ctx.fillStyle = p.box; ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.lineWidth = 6; ctx.strokeStyle = p.textHead; ctx.strokeRect(boxX, boxY, boxW, boxH);
      } 
      else if (boxStyle === 'soft_shadow') {
        ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 20;
        ctx.fillStyle = p.box;
        ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 24); ctx.fill();
        ctx.shadowBlur = 0; // reset
      }
      else if (boxStyle === 'outline') {
        ctx.lineWidth = 8; ctx.strokeStyle = p.accent;
        ctx.strokeRect(boxX, boxY, boxW, boxH);
        p.box = 'transparent'; // Remove fill for text
      }
      else if (boxStyle === 'floating') {
        // Split header box and body box
        ctx.fillStyle = p.accent; ctx.fillRect(boxX, boxY, boxW, 250);
        ctx.fillStyle = p.box; ctx.fillRect(boxX, boxY + 270, boxW, boxH - 270);
      }
      else if (boxStyle === 'glass') {
        ctx.fillStyle = p.box; ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 30); ctx.fill();
        ctx.globalAlpha = 1.0;
        ctx.lineWidth = 2; ctx.strokeStyle = p.accent;
        ctx.strokeRect(boxX+10, boxY+10, boxW-20, boxH-20);
      }

      // 4. Content Rendering
      const padX = boxX + 60;
      const contentW = boxW - 120;
      
      // Top Tags
      ctx.fillStyle = boxStyle === 'floating' ? p.textHead : p.accent;
      ctx.font = `800 28px "JetBrains Mono"`;
      ctx.fillText(`${inputs.i_badge.value} // ${inputs.i_cat.value.toUpperCase()}`, padX, boxY + 80);

      // Headline
      ctx.fillStyle = p.textHead;
      ctx.font = `900 ${inputs.s_headSize.value}px "${inputs.s_headFont.value}"`;
      const headLineHeight = parseInt(inputs.s_headSize.value) * 1.1;
      let nextY = wrapText(inputs.i_title.value, padX, boxY + 160, contentW, headLineHeight);

      // Divider
      nextY += 20;
      if(boxStyle !== 'floating') {
        ctx.lineWidth = 4; ctx.strokeStyle = p.border;
        ctx.beginPath(); ctx.moveTo(padX, nextY); ctx.lineTo(boxX + boxW - 60, nextY); ctx.stroke();
      }
      nextY += 80;

      // Body Bullets
      ctx.fillStyle = p.textBody;
      const bSize = parseInt(inputs.s_bodySize.value);
      ctx.font = `600 ${bSize}px "${inputs.s_bodyFont.value}"`;
      const bodyLines = inputs.i_body.value.split('\n');
      
      bodyLines.forEach((line, index) => {
        if (!line.trim()) return;
        nextY = wrapText(line, padX, nextY, contentW - 60, bSize * 1.4, true, inputs.s_bullet.value, index, p);
        nextY += 40; // Spacing between bullets
      });

      // Footer Banner
      const footerY = boxY + boxH - 100;
      ctx.fillStyle = p.accent;
      if (boxStyle === 'hard_shadow') {
        ctx.fillRect(boxX, footerY, boxW, 100);
        ctx.lineWidth = 6; ctx.strokeStyle = p.textHead;
        ctx.beginPath(); ctx.moveTo(boxX, footerY); ctx.lineTo(boxX+boxW, footerY); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.roundRect(padX, footerY, contentW, 80, 8); ctx.fill();
      }

      ctx.fillStyle = p.textHead === '#FFFFFF' ? '#000000' : p.textHead;
      if (p.accent === '#111317') ctx.fillStyle = '#FFFFFF';
      
      ctx.font = `800 26px "JetBrains Mono"`;
      ctx.textAlign = 'center';
      ctx.fillText(inputs.i_footer.value.toUpperCase(), boxX + (boxW/2), footerY + 50 + (boxStyle === 'hard_shadow' ? 0 : -10));
      ctx.textAlign = 'left';
    }

    // Attach Event Listeners to all inputs
    Object.values(inputs).forEach(el => {
      el.addEventListener('input', render);
      el.addEventListener('change', render);
    });

    // Download Logic
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `frame-${inputs.i_title.value.toLowerCase().replace(/[^a-z0-9]/g, '-')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Initial load
    document.fonts.ready.then(render);
    setTimeout(render, 500); 

  </script>
</body>
</html>
