<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DraftsRush Reel Asset Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #111317;
      color: #fff;
      font-family: 'Inter', sans-serif;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      color: #FFE600;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1400px;
      width: 100%;
    }
    .card {
      background: #1e2229;
      padding: 15px;
      border: 2px solid #333;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 16;
      border: 2px solid #000;
      margin-bottom: 12px;
    }
    button {
      background: #FFE600;
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 14px;
      padding: 10px 16px;
      border: 2px solid #000;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #fff;
    }
  </style>
</head>
<body>

  <h1>LumaFusion 1080x1920 Reel Assets</h1>
  
  <div class="grid">
    <div class="card">
      <canvas id="c1" width="1080" height="1920"></canvas>
      <button onclick="download('c1', '01-stop-writing.png')">Download Scene 1 PNG</button>
    </div>
    <div class="card">
      <canvas id="c2" width="1080" height="1920"></canvas>
      <button onclick="download('c2', '02-essay-draft.png')">Download Scene 2 PNG</button>
    </div>
    <div class="card">
      <canvas id="c3" width="1080" height="1920"></canvas>
      <button onclick="download('c3', '03-algorithm-skip.png')">Download Scene 3 PNG</button>
    </div>
    <div class="card">
      <canvas id="c4" width="1080" height="1920"></canvas>
      <button onclick="download('c4', '04-retention-draft.png')">Download Scene 4 PNG</button>
    </div>
    <div class="card">
      <canvas id="c5" width="1080" height="1920"></canvas>
      <button onclick="download('c5', '05-call-to-action.png')">Download Scene 5 PNG</button>
    </div>
  </div>

  <script>
    function drawBox(ctx, x, y, w, h, fill, border = '#000000', borderWidth = 8, shadow = 16) {
      if (shadow > 0) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(x + shadow, y + shadow, w, h);
      }
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = border;
      ctx.lineWidth = borderWidth;
      ctx.strokeRect(x, y, w, h);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    function renderAssets() {
      // 1. Hook Scene (Yellow)
      const c1 = document.getElementById('c1').getContext('2d');
      c1.fillStyle = '#FFE600';
      c1.fillRect(0, 0, 1080, 1920);
      c1.lineWidth = 24;
      c1.strokeStyle = '#000';
      c1.strokeRect(0, 0, 1080, 1920);

      drawBox(c1, 100, 580, 880, 680, '#FFFFFF', '#000', 10, 24);
      c1.fillStyle = '#000';
      c1.font = '900 110px "Space Grotesk", sans-serif';
      c1.fillText('STOP', 160, 750);
      c1.fillText('WRITING', 160, 880);
      c1.fillText('LIKE THIS!', 160, 1010);

      drawBox(c1, 160, 1080, 500, 70, '#000', '#000', 0, 0);
      c1.fillStyle = '#FFE600';
      c1.font = '700 32px "Space Grotesk", sans-serif';
      c1.fillText('DRAFTSRUSH STUDIO', 210, 1128);

      // 2. The Essay Draft (Grey)
      const c2 = document.getElementById('c2').getContext('2d');
      c2.fillStyle = '#E2E4E9';
      c2.fillRect(0, 0, 1080, 1920);
      c2.lineWidth = 24;
      c2.strokeStyle = '#000';
      c2.strokeRect(0, 0, 1080, 1920);

      drawBox(c2, 100, 360, 480, 80, '#000', '#000', 0, 0);
      c2.fillStyle = '#FFF';
      c2.font = '700 32px "Space Grotesk", sans-serif';
      c2.fillText('THE ESSAY DRAFT', 140, 412);

      drawBox(c2, 850, 340, 110, 110, '#EF4444', '#000', 8, 12);
      c2.fillStyle = '#FFF';
      c2.font = '900 64px sans-serif';
      c2.fillText('✕', 885, 418);

      drawBox(c2, 100, 490, 880, 920, '#FFFFFF', '#000', 10, 20);
      c2.fillStyle = '#111';
      c2.font = '600 42px "Inter", sans-serif';
      const essay = "Today, I wanted to discuss the importance of hooks in modern short-form vertical video. If you fail to capture attention within the first three seconds, your viewer retention graph will slump significantly, causing the algorithm to stop recommending your content, which leads to minimal reach across your account.";
      wrapText(c2, essay, 160, 620, 760, 68);

      // 3. Algorithm Skip (Black Screen)
      const c3 = document.getElementById('c3').getContext('2d');
      c3.fillStyle = '#111317';
      c3.fillRect(0, 0, 1080, 1920);
      c3.lineWidth = 24;
      c3.strokeStyle = '#000';
      c3.strokeRect(0, 0, 1080, 1920);

      drawBox(c3, 100, 780, 880, 340, '#000', '#FFE600', 8, 20);
      c3.fillStyle = '#FFF';
      c3.font = '700 50px "Space Grotesk", sans-serif';
      c3.fillText('ALGORITHM SAYS:', 160, 890);

      c3.fillStyle = '#FFE600';
      c3.font = '900 110px "Space Grotesk", sans-serif';
      c3.fillText('"SKIP"', 160, 1030);

      // 4. The Retention Draft (Yellow)
      const c4 = document.getElementById('c4').getContext('2d');
      c4.fillStyle = '#FFE600';
      c4.fillRect(0, 0, 1080, 1920);
      c4.lineWidth = 24;
      c4.strokeStyle = '#000';
      c4.strokeRect(0, 0, 1080, 1920);

      drawBox(c4, 100, 440, 520, 80, '#000', '#000', 0, 0);
      c4.fillStyle = '#FFE600';
      c4.font = '700 32px "Space Grotesk", sans-serif';
      c4.fillText('THE RETENTION DRAFT', 140, 492);

      drawBox(c4, 850, 420, 110, 110, '#4ADE80', '#000', 8, 12);
      c4.fillStyle = '#000';
      c4.font = '900 64px sans-serif';
      c4.fillText('✓', 885, 498);

      drawBox(c4, 100, 580, 880, 740, '#FFFFFF', '#000', 10, 20);
      drawBox(c4, 160, 660, 220, 60, '#000', '#000', 0, 0);
      c4.fillStyle = '#FFF';
      c4.font = '700 30px "JetBrains Mono", monospace';
      c4.fillText('[HOOK]', 210, 702);

      c4.fillStyle = '#000';
      c4.font = '900 68px "Space Grotesk", sans-serif';
      wrapText(c4, "Most video scripts FAIL right here.", 160, 840, 740, 90);

      drawBox(c4, 160, 1070, 740, 140, '#E2E4E9', '#000', 6, 8);
      c4.fillStyle = '#111';
      c4.font = '700 28px "Inter", sans-serif';
      c4.fillText('• 0 to 3s premise delivery', 190, 1125);
      c4.fillText('• Zero throat-clearing fluff', 190, 1175);

      // 5. Call To Action (Dark Canvas)
      const c5 = document.getElementById('c5').getContext('2d');
      c5.fillStyle = '#111317';
      c5.fillRect(0, 0, 1080, 1920);
      c5.lineWidth = 24;
      c5.strokeStyle = '#000';
      c5.strokeRect(0, 0, 1080, 1920);

      drawBox(c5, 100, 520, 880, 840, '#FFFFFF', '#000', 10, 24);
      c5.fillStyle = '#000';
      c5.font = '900 78px "Space Grotesk", sans-serif';
      c5.fillText('YOU HAVE NOTES.', 160, 670);

      c5.fillStyle = '#E11D48';
      c5.font = '900 68px "Space Grotesk", sans-serif';
      wrapText(c5, "WE BUILD THE BLUEPRINT.", 160, 770, 740, 80);

      c5.fillStyle = '#333';
      c5.font = '600 32px "Inter", sans-serif';
      wrapText(c5, "Send 1 rough concept in DM. We draft your opening hook in dual-column format for free.", 160, 960, 740, 48);

      drawBox(c5, 160, 1140, 740, 120, '#FFE600', '#000', 6, 10);
      c5.fillStyle = '#000';
      c5.font = '900 40px "Space Grotesk", sans-serif';
      c5.fillText('VISIT DRAFTSRUSH.COM', 220, 1215);
    }

    function download(canvasId, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = document.getElementById(canvasId).toDataURL('image/png');
      link.click();
    }

    document.fonts.ready.then(renderAssets);
  </script>
</body>
</html>
