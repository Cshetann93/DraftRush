<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DraftsRush - Story Strategy Animated Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111317;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    h1 {
      color: #FFE600;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    p {
      color: #D6E4EE;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      max-width: 500px;
    }
    button {
      background: #FFE600;
      color: #000;
      font-weight: 900;
      font-size: 13px;
      padding: 10px 18px;
      border: 3px solid #000;
      box-shadow: 3px 3px 0px #fff;
      cursor: pointer;
      text-transform: uppercase;
    }
    button:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #fff;
    }
    button:disabled {
      background: #444;
      color: #777;
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #D6E4EE;
    }
    .status-bar {
      background: #1C1F26;
      border: 2px solid #333;
      padding: 8px 16px;
      font-family: monospace;
      font-size: 13px;
      color: #34D399;
      margin-bottom: 14px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    canvas {
      width: 100%;
      max-width: 360px;
      height: auto;
      aspect-ratio: 9 / 16;
      border: 3px solid #FFE600;
      background: #111317;
      box-shadow: 0px 12px 32px rgba(0,0,0,0.8);
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>DraftsRush Story Strategy Studio</h1>
    <p>55-Second Smooth Timeline Animation Engine</p>
  </div>

  <div class="controls">
    <button id="btnPlay" onclick="handlePlay()">▶ Play Preview</button>
    <button id="btnRecord" onclick="handleRecord()">🔴 Record & Download Video</button>
    <button class="btn-secondary" onclick="downloadCurrentPNG()">📸 Download Frame PNG</button>
  </div>

  <div class="status-bar" id="statusText">Status: Engine Ready. Click Play.</div>

  <canvas id="reelCanvas" width="1080" height="1920"></canvas>

  <script>
    const canvas = document.getElementById('reelCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const btnPlay = document.getElementById('btnPlay');
    const btnRecord = document.getElementById('btnRecord');

    const SCENE_DURATION = 5.5; // 5.5s per slide
    const SCENES = [
      {
        id: 0,
        type: "intro",
        badge: "STORY BLUEPRINT",
        counter: "01 / 10",
        bg: "#FFE600",
        title: "Strategy: How to write your next story?",
        problem1: "Always confused with so many thoughts about a story?",
        problem2: "Too many ideas ruining the flow and basics of your story?",
        cta: "Follow this simple strategy for your next story."
      },
      {
        id: 1,
        stepIndex: 1,
        type: "step",
        badge: "STEP 01 • THE FOUNDATION",
        counter: "02 / 10",
        bg: "#E2E4E9",
        mainTitle: "Start with the context.",
        italicNote: "Present the verifiable facts.",
        desc: "Do not open with ungrounded speculation. Establish the baseline reality, world rules, and core character situation everyone accepts.",
        wireType: "flat",
        innerVisual: "factsList"
      },
      {
        id: 2,
        stepIndex: 2,
        type: "step",
        badge: "STEP 02 • THE OBSTACLE",
        counter: "03 / 10",
        bg: "#D6E4EE",
        mainTitle: "Frame the challenge.",
        italicNote: "Answer: 'What is the *real* problem?'",
        desc: "Surface events are just noise. Pinpoint the root internal or external conflict actively breaking the protagonist's normal world.",
        wireType: "drop",
        innerVisual: "tangle"
      },
      {
        id: 3,
        stepIndex: 3,
        type: "step",
        badge: "STEP 03 • THE CATALYST",
        counter: "04 / 10",
        bg: "#E2E4E9",
        mainTitle: "Establish urgency.",
        italicNote: "Why must we act right now?",
        desc: "Without stakes, narrative flow dies. Define what happens if the protagonist hesitates or fails to make a decision today.",
        wireType: "flat",
        innerVisual: "exclamation"
      },
      {
        id: 4,
        stepIndex: 4,
        type: "step",
        badge: "STEP 04 • THE BREAKTHROUGH",
        counter: "05 / 10",
        bg: "#FFF6CF",
        mainTitle: "Reveal your BIG IDEA.",
        italicNote: "This is your unique core solution.",
        desc: "Introduce the singular premise, motive, or counter-intuitive mechanism that changes the game and drives the second act.",
        wireType: "stepUp",
        innerVisual: "solutionCircle"
      },
      {
        id: 5,
        stepIndex: 5,
        type: "step",
        badge: "STEP 05 • VALUE DEFINITION",
        counter: "06 / 10",
        bg: "#D6E4EE",
        mainTitle: "Describe specific value.",
        italicNote: "Feature X yields Outcome Y.",
        desc: "Make emotional and narrative consequences clear. Show how each specific choice triggers an unmistakable dramatic payoff.",
        wireType: "stepDown",
        innerVisual: "valueEquation"
      },
      {
        id: 6,
        stepIndex: 6,
        type: "step",
        badge: "STEP 06 • STRATEGIC BETS",
        counter: "07 / 10",
        bg: "#E2E4E9",
        mainTitle: "Select 3 to 5 choices.",
        italicNote: "Say 'no' to noise, 'yes' to needle-movers.",
        desc: "Too many subplots ruin narrative flow. Focus exclusively on 3 critical story turns and discard distracting filler ideas.",
        wireType: "branchOut",
        innerVisual: "choicesBranch"
      },
      {
        id: 7,
        stepIndex: 7,
        type: "step",
        badge: "STEP 07 • PROOF POINTS",
        counter: "08 / 10",
        bg: "#CCD0DC",
        mainTitle: "Double-click each choice.",
        italicNote: "Concrete initiatives and capabilities.",
        desc: "Earn every story payoff. Demonstrate character competence and verified cause-and-effect instead of relying on coincidences.",
        wireType: "branchIn",
        innerVisual: "proofGrid"
      },
      {
        id: 8,
        stepIndex: 8,
        type: "step",
        badge: "STEP 08 • ROADMAP",
        counter: "09 / 10",
        bg: "#FFF6CF",
        mainTitle: "Sequence your actions.",
        italicNote: "Build your execution timeline.",
        desc: "Turn scenes into an unbroken timeline. Sequence scenes so each beat naturally forces the next without dragging.",
        wireType: "ganttStep",
        innerVisual: "ganttBars"
      },
      {
        id: 9,
        type: "cta",
        badge: "SCRIPTWRITING BLUEPRINT",
        counter: "10 / 10",
        bg: "#FFE600",
        headline: "CLOSE YOUR STORY WITH NEXT STEPS.",
        sub: "Stop letting chaotic thoughts derail your story. DraftsRush turns scattered creative concepts into sharp, production-ready video scripts."
      }
    ];

    const TOTAL_DURATION = SCENES.length * SCENE_DURATION; // 55.0 Seconds
    let startTime = null;
    let animFrameId = null;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let currentTotalTime = 0;

    function drawBox(x, y, w, h, fill, border = '#000000', borderWidth = 8, shadow = 16) {
      if (shadow > 0) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(x + shadow, y + shadow, w, h);
      }
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = border;
      ctx.lineWidth = borderWidth;
      ctx.strokeRect(x, y, w, h);
    }

    function wrapText(text, x, y, maxWidth, lineHeight) {
      const words = String(text).split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    function drawRoadmapLine(x, y, w, h) {
      drawBox(x, y, w, h, '#FFFFFF', '#000000', 8, 14);

      ctx.save();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 6;

      const points = [
        { x: x + 60, y: y + 210 },
        { x: x + 160, y: y + 210 },
        { x: x + 210, y: y + 290 },
        { x: x + 290, y: y + 290 },
        { x: x + 340, y: y + 210 },
        { x: x + 430, y: y + 210 },
        { x: x + 480, y: y + 130 },
        { x: x + 560, y: y + 130 },
        { x: x + 610, y: y + 210 },
        { x: x + 720, y: y + 210 },
        { x: x + 770, y: y + 290 },
        { x: x + w - 60, y: y + 290 }
      ];

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();

      const milestones = [
        { x: x + 110, y: y + 210, label: "01 Context" },
        { x: x + 250, y: y + 290, label: "02 Challenge" },
        { x: x + 385, y: y + 210, label: "03 Urgency" },
        { x: x + 520, y: y + 130, label: "04 Big Idea" },
        { x: x + 665, y: y + 210, label: "05 Value" },
        { x: x + 750, y: y + 250, label: "06 Choices" },
        { x: x + 810, y: y + 290, label: "07 Proof" },
        { x: x + w - 80, y: y + 290, label: "08 Action" }
      ];

      milestones.forEach((m, idx) => {
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(m.x + 4, m.y + 4, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = idx === 3 ? '#FFE600' : '#34D399';
        ctx.beginPath();
        ctx.arc(m.x, m.y, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#111317';
        ctx.font = '800 15px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(m.label, m.x, idx % 2 === 0 ? m.y - 26 : m.y + 36);
      });
      ctx.restore();
    }

    function drawSingleNode(nx, ny) {
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(nx + 6, ny + 6, 26, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#34D399';
      ctx.beginPath();
      ctx.arc(nx, ny, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 6;
      ctx.stroke();
    }

    function drawStepTimeline(type, x, y, w, h, visualType, lineProgress) {
      drawBox(x, y, w, h, '#FFFFFF', '#000000', 8, 14);

      ctx.save();
      const cy = y + h / 2;
      const cx = x + w / 2;

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 8;
      ctx.lineCap = 'square';

      if (type === "flat") {
        ctx.beginPath();
        ctx.moveTo(x + 40, cy);
        ctx.lineTo(x + 40 + (w - 80) * lineProgress, cy);
        ctx.stroke();
        if (lineProgress > 0.5) drawSingleNode(cx, cy);

      } else if (type === "drop") {
        ctx.beginPath();
        ctx.moveTo(x + 40, cy - 100);
        ctx.lineTo(cx - 180, cy - 100);
        ctx.lineTo(cx - 180, cy + 100);
        ctx.lineTo(cx + 180, cy + 100);
        ctx.lineTo(cx + 180, cy - 100);
        ctx.lineTo(x + w - 40, cy - 100);
        ctx.stroke();
        if (lineProgress > 0.4) drawSingleNode(cx, cy + 100);

      } else if (type === "stepUp") {
        ctx.beginPath();
        ctx.moveTo(x + 40, cy + 110);
        ctx.lineTo(cx - 180, cy + 110);
        ctx.lineTo(cx - 180, cy - 90);
        ctx.lineTo(x + w - 40, cy - 90);
        ctx.stroke();
        if (lineProgress > 0.4) drawSingleNode(cx, cy - 90);

      } else if (type === "stepDown") {
        ctx.beginPath();
        ctx.moveTo(x + 40, cy - 90);
        ctx.lineTo(cx + 180, cy - 90);
        ctx.lineTo(cx + 180, cy + 110);
        ctx.lineTo(x + w - 40, cy + 110);
        ctx.stroke();
        if (lineProgress > 0.4) drawSingleNode(cx - 40, cy - 90);

      } else if (type === "branchOut") {
        ctx.beginPath();
        ctx.moveTo(x + 40, cy);
        ctx.lineTo(cx - 160, cy);
        ctx.stroke();
        drawSingleNode(cx - 160, cy);

        [cy - 90, cy, cy + 90].forEach(by => {
          ctx.beginPath();
          ctx.moveTo(cx - 80, cy);
          ctx.lineTo(cx - 20, by);
          ctx.lineTo(x + w - 40, by);
          ctx.stroke();
        });

      } else if (type === "branchIn") {
        [cy - 90, cy, cy + 90].forEach(by => {
          ctx.beginPath();
          ctx.moveTo(x + 40, by);
          ctx.lineTo(cx + 20, by);
          ctx.lineTo(cx + 80, cy);
          ctx.stroke();
        });
        ctx.beginPath();
        ctx.moveTo(cx + 80, cy);
        ctx.lineTo(x + w - 40, cy);
        ctx.stroke();
        drawSingleNode(cx + 180, cy);

      } else if (type === "ganttStep") {
        ctx.beginPath();
        ctx.moveTo(x + 40, cy - 110);
        ctx.lineTo(cx - 180, cy - 110);
        ctx.lineTo(cx - 180, cy + 100);
        ctx.lineTo(x + w - 40, cy + 100);
        ctx.stroke();
        drawSingleNode(cx, cy + 100);
      }

      if (visualType === "factsList") {
        [cy + 45, cy + 85, cy + 125].forEach((ly, i) => {
          drawBox(cx - 140, ly, 280, 24, i === 0 ? '#FFE600' : '#E2E4E9', '#000', 3, 0);
        });
      } else if (visualType === "tangle") {
        ctx.strokeStyle = '#FB7185';
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let a = 0; a < Math.PI * 8; a += 0.3) {
          const r = 40 + Math.sin(a * 4) * 20;
          ctx.lineTo(cx + Math.cos(a) * r, (cy - 40) + Math.sin(a) * r);
        }
        ctx.stroke();
      } else if (visualType === "exclamation") {
        drawBox(cx - 140, cy - 130, 45, 90, '#FB7185', '#000', 4, 4);
        drawBox(cx - 140, cy - 25, 45, 30, '#FB7185', '#000', 4, 4);
      } else if (visualType === "solutionCircle") {
        ctx.strokeStyle = '#34D399';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(cx, cy + 30, 65, 0, Math.PI * 2);
        ctx.stroke();
      } else if (visualType === "valueEquation") {
        drawBox(cx - 210, cy + 20, 180, 50, '#FFE600', '#000', 3, 0);
        ctx.fillStyle = '#000';
        ctx.font = '900 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('{FEATURE X}', cx - 120, cy + 52);

        ctx.fillText('➔', cx + 10, cy + 54);

        drawBox(cx + 50, cy + 20, 180, 50, '#34D399', '#000', 3, 0);
        ctx.fillStyle = '#000';
        ctx.fillText('{OUTCOME Y}', cx + 140, cy + 52);
      } else if (visualType === "choicesBranch") {
        ['CHOICE 1', 'CHOICE 2', 'CHOICE 3'].forEach((c, idx) => {
          const by = (cy - 90) + (idx * 90);
          drawBox(cx + 20, by - 26, 180, 52, '#FFFFFF', '#000', 4, 4);
          ctx.fillStyle = '#000';
          ctx.font = '900 16px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(c, cx + 110, by + 6);
        });
      } else if (visualType === "proofGrid") {
        ['PROOF 1', 'PROOF 2', 'PROOF 3'].forEach((p, idx) => {
          const by = (cy - 90) + (idx * 90);
          drawBox(cx - 220, by - 26, 180, 52, '#FFFFFF', '#000', 4, 4);
          ctx.fillStyle = '#000';
          ctx.font = '900 16px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(p, cx - 130, by + 6);
        });
      } else if (visualType === "ganttBars") {
        [
          { x: cx - 130, y: cy - 70, w: 120 },
          { x: cx - 60, y: cy - 25, w: 140 },
          { x: cx + 20, y: cy + 20, w: 150 }
        ].forEach((bar, idx) => {
          drawBox(bar.x, bar.y, bar.w, 32, idx === 2 ? '#34D399' : '#FFE600', '#000', 3, 0);
        });
      }

      ctx.restore();
    }

    function render(totalTime) {
      currentTotalTime = totalTime;
      const sceneIndex = Math.min(SCENES.length - 1, Math.floor(totalTime / SCENE_DURATION));
      const sceneTime = totalTime - (sceneIndex * SCENE_DURATION);
      const data = SCENES[sceneIndex];

      ctx.fillStyle = data.bg;
      ctx.fillRect(0, 0, 1080, 1920);

      ctx.lineWidth = 24;
      ctx.strokeStyle = '#000000';
      ctx.strokeRect(0, 0, 1080, 1920);

      drawBox(90, 90, 520, 72, '#000000', '#000000', 0, 0);
      ctx.fillStyle = '#FFE600';
      ctx.font = '900 24px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(data.badge, 120, 136);

      drawBox(840, 90, 150, 72, '#FFFFFF', '#000000', 4, 6);
      ctx.fillStyle = '#000000';
      ctx.font = '900 28px monospace';
      ctx.fillText(data.counter, 860, 136);

      if (data.type === "intro") {
        drawBox(90, 200, 900, 1420, '#FFFFFF', '#000000', 10, 24);

        const tTitle = Math.min(1, sceneTime / 0.6);
        const yTitle = 100 + (easeOutBack(tTitle) * 210);
        ctx.fillStyle = '#000000';
        ctx.font = '900 68px sans-serif';
        wrapText(data.headline, 140, yTitle, 800, 76);

        drawRoadmapLine(140, 480, 800, 360);

        if (sceneTime > 1.2) {
          const tP1 = Math.min(1, (sceneTime - 1.2) / 0.5);
          const xP1 = -700 + (easeOutBack(tP1) * 840);
          drawBox(xP1, 880, 800, 180, '#FFF1F2', '#000000', 6, 10);
          ctx.fillStyle = '#E11D48';
          ctx.font = '900 24px sans-serif';
          ctx.fillText('CONFUSION', xP1 + 30, 925);

          const p1Chars = Math.floor((sceneTime - 1.4) * 32);
          ctx.fillStyle = '#111317';
          ctx.font = '700 30px sans-serif';
          wrapText(data.problem1.substring(0, p1Chars), xP1 + 30, 975, 740, 42);
        }

        if (sceneTime > 2.4) {
          const tP2 = Math.min(1, (sceneTime - 2.4) / 0.5);
          const xP2 = 1100 - (easeOutBack(tP2) * 960);
          drawBox(xP2, 1090, 800, 180, '#D6E4EE', '#000000', 6, 10);
          ctx.fillStyle = '#000000';
          ctx.font = '900 24px sans-serif';
          ctx.fillText('RUINED FLOW', xP2 + 30, 1135);

          const p2Chars = Math.floor((sceneTime - 2.6) * 32);
          ctx.fillStyle = '#111317';
          ctx.font = '700 30px sans-serif';
          wrapText(data.problem2.substring(0, p2Chars), xP2 + 30, 1185, 740, 42);
        }

        if (sceneTime > 3.6) {
          const tCta = Math.min(1, (sceneTime - 3.6) / 0.5);
          const yCta = 1500 - (easeOutBack(tCta) * 190);
          drawBox(140, yCta, 800, 150, '#FFE600', '#000000', 6, 10);
          ctx.fillStyle = '#000000';
          ctx.font = '900 34px sans-serif';
          wrapText(data.cta, 170, yCta + 60, 740, 44);
        }

        drawBox(90, 1680, 900, 110, '#000000', '#000000', 0, 0);
        ctx.fillStyle = '#FFE600';
        ctx.font = '900 30px sans-serif';
        ctx.fillText('SWIPE TO FOLLOW THE LINE', 140, 1748);
        ctx.fillText('→', 930, 1748);

      } else if (data.type === "step") {
        const tHead = Math.min(1, sceneTime / 0.5);
        const xHead = -850 + (easeOutBack(tHead) * 940);
        drawBox(xHead, 190, 900, 180, '#FFFFFF', '#000000', 8, 14);

        ctx.fillStyle = '#000000';
        ctx.font = '900 48px sans-serif';
        ctx.fillText(data.mainTitle, xHead + 40, 270);

        ctx.fillStyle = '#E11D48';
        ctx.font = '700 32px sans-serif';
        ctx.fillText(data.italicNote, xHead + 40, 320);

        const tStage = Math.min(1, Math.max(0, (sceneTime - 0.4) / 0.5));
        const yStage = 600 - (easeOutBack(tStage) * 200);
        const lineProg = Math.min(1, Math.max(0, (sceneTime - 0.7) / 0.6));
        drawStepTimeline(data.wireType, 90, yStage, 900, 520, data.innerVisual, lineProg);

        const tCard = Math.min(1, Math.max(0, (sceneTime - 1.4) / 0.5));
        const yCard = 1180 - (easeOutBack(tCard) * 220);
        drawBox(90, yCard, 900, 360, '#FFFFFF', '#000000', 8, 14);

        drawBox(130, yCard + 35, 360, 45, '#FFE600', '#000000', 0, 0);
        ctx.fillStyle = '#000000';
        ctx.font = '900 22px sans-serif';
        ctx.fillText('WHY RETENTION DEMANDS THIS', 150, yCard + 66);

        if (sceneTime > 1.8) {
          const charCount = Math.floor((sceneTime - 1.8) * 30);
          const currentText = data.desc.substring(0, charCount);
          ctx.fillStyle = '#111317';
          ctx.font = '600 34px sans-serif';
          wrapText(currentText, 130, yCard + 140, 820, 52);

          if (Math.floor(sceneTime * 3) % 2 === 0 && charCount < data.desc.length) {
            ctx.fillStyle = '#E11D48';
            ctx.fillRect(130 + ctx.measureText(currentText.split(' ').pop()).width + 8, yCard + 105, 6, 38);
          }
        }

        if (sceneTime > 3.0) {
          const tPill = Math.min(1, (sceneTime - 3.0) / 0.4);
          const yPill = 1600 - (easeOutBack(tPill) * 220);
          drawBox(90, yPill, 900, 180, '#D6E4EE', '#000000', 8, 14);

          drawBox(130, yPill + 25, 330, 40, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#34D399';
          ctx.font = '900 20px sans-serif';
          ctx.fillText('SCRIPTWRITING BLUEPRINT', 150, yPill + 52);

          ctx.fillStyle = '#000000';
          ctx.font = '700 28px sans-serif';
          wrapText(`Lock this premise before second ${data.stepIndex * 8}. Every second of throat clearing decays viewer interest.`, 130, yPill + 105, 820, 38);
        }

        ctx.fillStyle = '#000000';
        ctx.font = '800 28px sans-serif';
        ctx.fillText('DRAFTSRUSH STUDIO', 90, 1830);
        ctx.font = '700 26px monospace';
        ctx.fillText('draftsrush.com', 720, 1830);

      } else if (data.type === "cta") {
        drawBox(90, 200, 900, 1420, '#FFFFFF', '#000000', 10, 24);

        ctx.fillStyle = '#000000';
        ctx.font = '900 70px sans-serif';
        wrapText(data.headline, 140, 340, 800, 78);

        const subChars = Math.floor(sceneTime * 32);
        ctx.fillStyle = '#111317';
        ctx.font = '600 34px sans-serif';
        wrapText(data.sub.substring(0, subChars), 140, 540, 800, 50);

        if (sceneTime > 1.2) {
          const tOffer = Math.min(1, (sceneTime - 1.2) / 0.5);
          const yOffer = 960 - (easeOutBack(tOffer) * 200);
          drawBox(140, yOffer, 800, 340, '#D6E4EE', '#000000', 6, 12);
          ctx.fillStyle = '#000000';
          ctx.font = '900 34px sans-serif';
          ctx.fillText('TEST OUR PACING FIRST', 180, yOffer + 70);

          ctx.fillStyle = '#222222';
          ctx.font = '600 28px sans-serif';
          wrapText("Send us 1 rough topic or notes outline in our DM. We will draft your hook and opening act in dual-column format completely free.", 180, yOffer + 130, 720, 42);
        }

        if (sceneTime > 2.4) {
          const tBtn = Math.min(1, (sceneTime - 2.4) / 0.5);
          const yBtn = 1380 - (easeOutBack(tBtn) * 220);

          drawBox(140, yBtn, 800, 110, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#34D399';
          ctx.font = '900 34px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('📩 DM "STORY" ON INSTAGRAM', 140 + 400, yBtn + 70);

          drawBox(140, yBtn + 140, 800, 110, '#FFE600', '#000000', 6, 8);
          ctx.fillStyle = '#000000';
          ctx.font = '900 34px sans-serif';
          ctx.fillText('🌐 VISIT DRAFTSRUSH.COM', 140 + 400, yBtn + 210);
        }

        ctx.textAlign = 'left';
        ctx.fillStyle = '#000000';
        ctx.font = '800 32px sans-serif';
        ctx.fillText('DRAFTSRUSH STUDIO • 2026', 90, 1780);
      }
    }

    function animLoop(timestamp) {
      if (!startTime) startTime = timestamp;
      const progress = (timestamp - startTime) / 1000;

      if (progress <= TOTAL_DURATION) {
        render(progress);
        const curSec = Math.floor(progress);
        const activeScene = Math.min(SCENES.length, Math.floor(progress / SCENE_DURATION) + 1);
        statusText.innerText = `Scene ${activeScene}/10 • Time: ${curSec}s / 55s`;
        animFrameId = requestAnimationFrame(animLoop);
      } else {
        render(TOTAL_DURATION);
        if (isRecording) {
          stopMediaRecorder();
        } else {
          statusText.innerText = "Status: Preview complete (55s).";
          btnPlay.disabled = false;
          btnRecord.disabled = false;
        }
      }
    }

    function handlePlay() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      startTime = null;
      btnPlay.disabled = true;
      statusText.innerText = "Playing preview...";
      animFrameId = requestAnimationFrame(animLoop);
    }

    function handleRecord() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      statusText.innerText = "Recording full 55s video... Do not close tab.";
      btnPlay.disabled = true;
      btnRecord.disabled = true;
      isRecording = true;
      recordedChunks = [];

      const stream = canvas.captureStream(30); // 30 FPS
      let mime = 'video/webm;codecs=vp9';
      if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

      try {
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
      } catch (err) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'story-strategy-reel-55s.webm';
        a.click();

        statusText.innerText = "Done: Video downloaded successfully!";
        btnPlay.disabled = false;
        btnRecord.disabled = false;
        isRecording = false;
      };

      mediaRecorder.start();
      startTime = null;
      animFrameId = requestAnimationFrame(animLoop);
    }

    function stopMediaRecorder() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
    }

    function downloadCurrentPNG() {
      const link = document.createElement('a');
      link.download = `story-strategy-frame-${Math.floor(currentTotalTime)}s.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Initial first frame render immediately on load
    window.addEventListener('DOMContentLoaded', () => {
      render(0);
    });
  </script>
</body>
</html>
