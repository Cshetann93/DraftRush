<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DraftsRush - Photo-Annotated Cinematography Reel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111317;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header-panel {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      color: #FFE600;
      font-size: 28px;
      margin-bottom: 8px;
    }
    p {
      color: #D6E4EE;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .btn-zip {
      background: #FFE600;
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 16px;
      padding: 12px 24px;
      border: 3px solid #000;
      box-shadow: 4px 4px 0px #fff;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.1s;
    }
    .btn-zip:hover { transform: translate(-2px, -2px); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1400px;
      width: 100%;
    }
    .card {
      background: #1C1F26;
      border: 2px solid #333;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 16;
      border: 2px solid #000;
      margin-bottom: 12px;
      background: #E2E4E9;
    }
    .btn-single {
      background: #D6E4EE;
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 13px;
      padding: 8px 12px;
      border: 2px solid #000;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
    }
    .btn-single:hover { background: #FFE600; }
  </style>
</head>
<body>

  <div class="header-panel">
    <h1>Photo-Annotated Cinematography Reel (1080x1920)</h1>
    <p>Real Scene Photos + Live Vector Graphic Overlays + Script Cues</p>
    <button class="btn-zip" onclick="downloadAll()">Download All 8 PNGs (.ZIP)</button>
  </div>

  <div class="grid" id="gridContainer"></div>

  <script>
    const rulesData = [
      {
        type: "intro",
        badge: "🎥 CINEMATOGRAPHY BLUEPRINTS",
        title1: "TOP 6 RULES",
        title2: "OF CAMERA",
        deck: "Every angle change alters how the viewer subconsciously judges your subject. When framing is arbitrary, visual storytelling dies.",
        subDeck: "6 essential geometric camera rules broken down with real photo stills, vector overlays, and exact script use cases."
      },
      {
        type: "rule",
        num: "01",
        emoji: "🔄",
        ruleName: "THE 180° RULE",
        tag: "SPATIAL CONTINUITY",
        bg: "#E2E4E9",
        accentCard: "#FFF6CF",
        imgUrl: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=900&auto=format&fit=crop&q=80",
        overlayType: "180degree",
        situation: "Two characters facing each other in conversation.",
        impact: "Draws an imaginary axis between characters. Keeping cameras on one side preserves screen direction. Crossing it makes actors appear to face the wrong way.",
        scriptCue: "In dual-column notes, label setups as 'Cam A (Host Profile) / Cam B (Guest Match)' to prevent crossed lines in the edit."
      },
      {
        type: "rule",
        num: "02",
        emoji: "📐",
        ruleName: "LOW VS HIGH ANGLE",
        tag: "POWER DYNAMICS",
        bg: "#D6E4EE",
        accentCard: "#FFFFFF",
        imgUrl: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900&auto=format&fit=crop&q=80",
        overlayType: "angles",
        situation: "Confrontations, negotiations, villains, or helpless victims.",
        impact: "Shooting upward from below makes subjects appear dominant, menacing, or heroic. Shooting downward from above shrinks them into vulnerable or trapped positions.",
        scriptCue: "Add '[LOW ANGLE - 35mm PUSH]' when a protagonist takes charge, or '[HIGH ANGLE - CRANE DOWN]' to highlight defeat."
      },
      {
        type: "rule",
        num: "03",
        emoji: "🌪️",
        ruleName: "THE DUTCH ANGLE",
        tag: "PSYCHOLOGICAL UNREST",
        bg: "#E2E4E9",
        accentCard: "#FFF1F2",
        imgUrl: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=900&auto=format&fit=crop&q=80",
        overlayType: "dutch",
        situation: "Panic, intoxication, disorientation, or narrative deception.",
        impact: "Tilting the camera 15 to 30 degrees off the horizontal axis strips stability from the room, making viewers feel instinctively uncomfortable or suspicious.",
        scriptCue: "Use '[CANTED ANGLE / DUTCH ROLL]' right before an unexpected plot twist or during a psychological breakdown."
      },
      {
        type: "rule",
        num: "04",
        emoji: "🔲",
        ruleName: "THIRDS & EYE-LINE",
        tag: "COMPOSITIONAL BALANCE",
        bg: "#CCD0DC",
        accentCard: "#FFFFFF",
        imgUrl: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=900&auto=format&fit=crop&q=80",
        overlayType: "thirds",
        situation: "Standard dialogue scenes, interviews, and documentary setups.",
        impact: "Splits the screen into a 3x3 grid. Placing eyes along the top horizontal third creates natural visual comfort. Centering works for tension, but thirds keep flow.",
        scriptCue: "Note '[FRAMED STAGE LEFT - THIRDS]' so editors have dedicated negative space to pop up on-screen data or hook graphics."
      },
      {
        type: "rule",
        num: "05",
        emoji: "🏃",
        ruleName: "LEAD ROOM SPACE",
        tag: "ACTION DIRECTION",
        bg: "#FFF6CF",
        accentCard: "#D6E4EE",
        imgUrl: "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=900&auto=format&fit=crop&q=80",
        overlayType: "leadroom",
        situation: "Moving subjects, walking shots, or driving sequences.",
        impact: "Leave open frame space in the direction the subject is looking or walking. Framing someone right against the edge feels suffocated unless that panic is intentional.",
        scriptCue: "Write '[TRACKING - GENEROUS LEAD ROOM]' for purposeful journeys, or '[NOSE TO BORDER]' when a character is backed into a corner."
      },
      {
        type: "rule",
        num: "06",
        emoji: "🗣️",
        ruleName: "DIRTY O.T.S.",
        tag: "INTIMACY & PROXIMITY",
        bg: "#D6E4EE",
        accentCard: "#FFFFFF",
        imgUrl: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=900&auto=format&fit=crop&q=80",
        overlayType: "ots",
        situation: "Intense one-on-one arguments, romance, or interrogations.",
        impact: "Including a slice of the foreground character's shoulder or hair ties the two actors into a shared tangible space, forcing the audience into the conversation.",
        scriptCue: "Use '[DIRTY OTS - TIGHT ON EYES]' to raise emotional tension without cutting away to an isolated, lonely single."
      },
      {
        type: "cta",
        badge: "🎬 PRODUCTION MASTERCLASS",
        title: "WANT THE FULL BLUEPRINT?",
        deck: "Cinematography only works when your script maps every lens, angle, and cut before the crew arrives on set.",
        boxTitle: "DIRECT SCRIPT INTAKE & ADVICE",
        boxText: "DM us 'COURSE' on Instagram for our private production guides and shot-planning decks, or book a custom video script at draftsrush.com.",
        btn1: "📩 DM 'COURSE' ON INSTAGRAM",
        btn2: "🌐 VISIT DRAFTSRUSH.COM"
      }
    ];

    const container = document.getElementById('gridContainer');
    const canvases = [];
    const loadedImages = {};

    function drawBrutalBox(ctx, x, y, w, h, fill, border = '#000000', borderWidth = 8, shadow = 16) {
      if (shadow > 0) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(x + shadow, y + shadow, w, h);
      }
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = border;
      ctx.lineWidth = borderWidth;
      ctx.strokeRect(x, y, w, h);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    // Build DOM elements
    rulesData.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'card';

      const canvas = document.createElement('canvas');
      canvas.width = 1080;
      canvas.height = 1920;
      canvas.id = `canvas-${idx}`;
      card.appendChild(canvas);

      const btn = document.createElement('button');
      btn.className = 'btn-single';
      btn.innerText = idx === 0 ? 'Download Title Card PNG' : (idx === 7 ? 'Download CTA Frame PNG' : `Download Rule 0${idx} PNG`);
      btn.onclick = () => downloadSingle(canvas, idx === 0 ? 'cinematography-00-intro.png' : (idx === 7 ? 'cinematography-07-cta.png' : `cinematography-0${idx}-rule.png`));
      card.appendChild(btn);

      container.appendChild(card);
      canvases.push(canvas);
    });

    // Helper: Draw Image with "cover" fit inside target box
    function drawImageCover(ctx, img, x, y, w, h) {
      const imgRatio = img.width / img.height;
      const targetRatio = w / h;
      let sx, sy, sw, sh;

      if (imgRatio > targetRatio) {
        sh = img.height;
        sw = img.height * targetRatio;
        sx = (img.width - sw) / 2;
        sy = 0;
      } else {
        sw = img.width;
        sh = img.width / targetRatio;
        sx = 0;
        sy = (img.height - sh) / 2;
      }
      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }

    // Annotate Over the Real Photo
    function drawPhotoWithAnnotations(ctx, img, type, x, y, w, h) {
      ctx.save();
      // Drop Shadow for frame
      ctx.fillStyle = '#000000';
      ctx.fillRect(x + 14, y + 14, w, h);

      // Clip canvas to rounded/border frame
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();

      // Render Base Photo
      if (img) {
        drawImageCover(ctx, img, x, y, w, h);
        // Semi-transparent cinematic contrast darkener
        ctx.fillStyle = 'rgba(17, 19, 23, 0.40)';
        ctx.fillRect(x, y, w, h);
      } else {
        ctx.fillStyle = '#222';
        ctx.fillRect(x, y, w, h);
      }

      const cx = x + w / 2;
      const cy = y + h / 2;

      // OVERLAYS BY RULE TYPE
      if (type === "180degree") {
        // Red dashed axis
        ctx.strokeStyle = '#EF4444';
        ctx.lineWidth = 6;
        ctx.setLineDash([12, 12]);
        ctx.beginPath();
        ctx.moveTo(x + 40, cy);
        ctx.lineTo(x + w - 40, cy);
        ctx.stroke();
        ctx.setLineDash([]);

        // Axis Label
        drawBrutalBox(ctx, cx - 140, cy - 65, 280, 36, '#EF4444', '#000', 3, 0);
        ctx.fillStyle = '#FFF';
        ctx.font = '800 16px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('LINE OF ACTION (AXIS)', cx, cy - 41);

        // Safe 180° Green Field
        ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
        ctx.beginPath();
        ctx.arc(cx, cy, 180, 0, Math.PI, false);
        ctx.fill();

        ctx.strokeStyle = '#10B981';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(cx, cy, 180, 0, Math.PI, false);
        ctx.stroke();

        ctx.font = '50px sans-serif';
        ctx.fillText('🎥✅', cx - 130, cy + 90);
        ctx.fillText('🎥✅', cx + 130, cy + 90);
        ctx.fillText('🎥❌', cx, cy - 110);

        drawBrutalBox(ctx, cx - 150, cy + 150, 300, 42, '#10B981', '#000', 3, 4);
        ctx.fillStyle = '#000';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('KEEP CAMERAS ON 1 SIDE', cx, cy + 177);

      } else if (type === "angles") {
        // Split line
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(cx, y); ctx.lineTo(cx, y + h); ctx.stroke();

        // Left: Low Angle Arrow pointing UP
        ctx.strokeStyle = '#3B82F6';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(x + 80, cy + 120);
        ctx.lineTo(x + 200, cy - 40);
        ctx.stroke();

        ctx.font = '60px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🎥', x + 80, cy + 150);

        drawBrutalBox(ctx, x + 40, cy - 140, 260, 45, '#3B82F6', '#000', 3, 4);
        ctx.fillStyle = '#FFF';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('LOW ANGLE = POWER 👑', x + 170, cy - 111);

        // Right: High Angle Arrow pointing DOWN
        ctx.strokeStyle = '#EF4444';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(x + w - 80, cy - 80);
        ctx.lineTo(x + w - 200, cy + 80);
        ctx.stroke();

        ctx.fillText('🎥', x + w - 80, cy - 110);

        drawBrutalBox(ctx, cx + 40, cy + 130, 280, 45, '#EF4444', '#000', 3, 4);
        ctx.fillStyle = '#FFF';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.fillText('HIGH ANGLE = WEAK 😰', cx + 180, cy + 159);

      } else if (type === "dutch") {
        // Horizon reference
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 4;
        ctx.setLineDash([12, 12]);
        ctx.beginPath(); ctx.moveTo(x, cy); ctx.lineTo(x + w, cy); ctx.stroke();
        ctx.setLineDash([]);

        // Tilted frame
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-20 * Math.PI / 180);

        ctx.strokeStyle = '#FB7185';
        ctx.lineWidth = 8;
        ctx.strokeRect(-260, -140, 520, 280);

        drawBrutalBox(ctx, -160, 100, 320, 42, '#FB7185', '#000', 3, 4);
        ctx.fillStyle = '#FFF';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⟳ TILT: -20° CANTED AXIS', 0, 127);
        ctx.restore();

        // Unease pill
        drawBrutalBox(ctx, cx - 180, y + 30, 360, 45, '#FFE600', '#000', 3, 4);
        ctx.fillStyle = '#000';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PRODUCES UNEASE & PANIC 🌪️', cx, y + 59);

      } else if (type === "thirds") {
        const tw = w / 3;
        const th = h / 3;

        // Grid lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x + tw, y); ctx.lineTo(x + tw, y + h);
        ctx.moveTo(x + tw * 2, y); ctx.lineTo(x + tw * 2, y + h);
        ctx.moveTo(x, y + th); ctx.lineTo(x + w, y + th);
        ctx.moveTo(x, y + th * 2); ctx.lineTo(x + w, y + th * 2);
        ctx.stroke();

        // 4 Target Intersection Bullets
        [
          [x + tw, y + th], [x + tw * 2, y + th],
          [x + tw, y + th * 2], [x + tw * 2, y + th * 2]
        ].forEach(([px, py]) => {
          ctx.fillStyle = '#38BDF8';
          ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.stroke();
        });

        // Top Third Eye-line Anchor Banner
        drawBrutalBox(ctx, cx - 190, y + th - 24, 380, 48, '#FFE600', '#000', 3, 4);
        ctx.fillStyle = '#000';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🎯 ANCHOR EYES ON TOP THIRD', cx, y + th + 6);

      } else if (type === "leadroom") {
        // Forward Action Vector
        ctx.strokeStyle = '#10B981';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(cx - 80, cy);
        ctx.lineTo(x + w - 80, cy);
        ctx.stroke();

        // Arrow head
        ctx.fillStyle = '#10B981';
        ctx.beginPath();
        ctx.moveTo(x + w - 60, cy);
        ctx.lineTo(x + w - 100, cy - 30);
        ctx.lineTo(x + w - 100, cy + 30);
        ctx.fill();

        // Lead Space Box Overlay
        ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
        ctx.fillRect(cx, y + 40, w / 2 - 40, h - 80);
        ctx.strokeStyle = '#10B981';
        ctx.lineWidth = 4;
        ctx.strokeRect(cx, y + 40, w / 2 - 40, h - 80);

        drawBrutalBox(ctx, cx + 20, cy - 25, 260, 48, '#10B981', '#000', 3, 4);
        ctx.fillStyle = '#000';
        ctx.font = '900 18px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('LEAD ROOM (LOOK SPACE) 👀', cx + 150, cy + 5);

      } else if (type === "ots") {
        // Sightline connecting actors
        ctx.strokeStyle = '#38BDF8';
        ctx.lineWidth = 6;
        ctx.setLineDash([12, 12]);
        ctx.beginPath();
        ctx.moveTo(x + 160, y + h - 80);
        ctx.lineTo(cx + 80, cy - 40);
        ctx.stroke();
        ctx.setLineDash([]);

        // Foreground Tag
        drawBrutalBox(ctx, x + 30, y + h - 70, 220, 42, '#111317', '#000', 3, 0);
        ctx.fillStyle = '#FFF';
        ctx.font = '900 16px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FOREGROUND SHOULDER', x + 140, y + h - 43);

        // Subject Tag
        drawBrutalBox(ctx, cx, cy - 100, 200, 42, '#FFE600', '#000', 3, 4);
        ctx.fillStyle = '#000';
        ctx.font = '900 16px "Space Grotesk", sans-serif';
        ctx.fillText('SUBJECT IN FOCUS 🎯', cx + 100, cy - 73);
      }

      ctx.restore();

      // Outer Thick Border over the clipped image
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 8;
      ctx.strokeRect(x, y, w, h);
    }

    function renderAll() {
      rulesData.forEach((data, idx) => {
        const canvas = canvases[idx];
        const ctx = canvas.getContext('2d');
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';

        if (data.type === "intro") {
          // Cover Slide
          ctx.fillStyle = '#FFE600';
          ctx.fillRect(0, 0, 1080, 1920);
          ctx.lineWidth = 24;
          ctx.strokeStyle = '#000000';
          ctx.strokeRect(0, 0, 1080, 1920);

          drawBrutalBox(ctx, 90, 130, 560, 75, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 24px "Space Grotesk", sans-serif';
          ctx.fillText(data.badge, 120, 178);

          ctx.fillStyle = '#000000';
          ctx.font = '900 32px "JetBrains Mono", monospace';
          ctx.fillText('01 / 08', 860, 176);

          drawBrutalBox(ctx, 90, 250, 900, 1360, '#FFFFFF', '#000000', 10, 24);

          drawBrutalBox(ctx, 140, 320, 800, 180, '#FB7185', '#000000', 8, 14);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 105px "Space Grotesk", sans-serif';
          ctx.fillText(data.title1, 180, 450);

          drawBrutalBox(ctx, 140, 530, 800, 180, '#FFE600', '#000000', 8, 14);
          ctx.fillStyle = '#000000';
          ctx.font = '900 100px "Space Grotesk", sans-serif';
          ctx.fillText(data.title2, 210, 660);

          ctx.fillStyle = '#111317';
          ctx.font = '700 36px "Inter", sans-serif';
          wrapText(ctx, data.deck, 140, 800, 800, 52);

          drawBrutalBox(ctx, 140, 1040, 800, 260, '#D6E4EE', '#000000', 6, 12);
          ctx.fillStyle = '#000000';
          ctx.font = '900 26px "Space Grotesk", sans-serif';
          ctx.fillText('WHY AMATEUR VIDEOS FEEL FLAT 📉', 180, 1105);

          ctx.fillStyle = '#222222';
          ctx.font = '600 28px "Inter", sans-serif';
          wrapText(ctx, data.subDeck, 180, 1165, 720, 42);

          drawBrutalBox(ctx, 90, 1660, 900, 120, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#FFE600';
          ctx.font = '900 32px "Space Grotesk", sans-serif';
          ctx.fillText('SWIPE FOR 6 CAMERA BLUEPRINTS', 140, 1735);
          ctx.fillText('→', 930, 1735);

        } else if (data.type === "rule") {
          // Rule Frame
          ctx.fillStyle = data.bg;
          ctx.fillRect(0, 0, 1080, 1920);
          ctx.lineWidth = 24;
          ctx.strokeStyle = '#000000';
          ctx.strokeRect(0, 0, 1080, 1920);

          drawBrutalBox(ctx, 90, 80, 520, 68, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#FFE600';
          ctx.font = '900 24px "Space Grotesk", sans-serif';
          ctx.fillText(`RULE ${data.num} • ${data.tag}`, 115, 122);

          drawBrutalBox(ctx, 840, 80, 150, 68, '#FFFFFF', '#000000', 4, 6);
          ctx.fillStyle = '#000000';
          ctx.font = '900 28px "JetBrains Mono", monospace';
          ctx.fillText(`0${idx + 1}/08`, 865, 124);

          drawBrutalBox(ctx, 90, 175, 900, 130, '#FFFFFF', '#000000', 8, 14);
          ctx.fillStyle = '#000000';
          ctx.font = '900 46px "Space Grotesk", sans-serif';
          ctx.fillText(`${data.emoji} ${data.ruleName}`, 120, 258);

          // RENDER REAL PHOTO + GRAPHIC OVERLAY
          drawPhotoWithAnnotations(ctx, loadedImages[data.imgUrl], data.overlayType, 90, 335, 900, 480);

          // BEST USE CASE
          drawBrutalBox(ctx, 90, 850, 900, 220, data.accentCard, '#000000', 8, 14);
          drawBrutalBox(ctx, 130, 885, 290, 45, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#FFE600';
          ctx.font = '900 22px "Space Grotesk", sans-serif';
          ctx.fillText('📌 BEST USE CASE', 150, 916);

          ctx.fillStyle = '#111317';
          ctx.font = '800 32px "Inter", sans-serif';
          wrapText(ctx, data.situation, 130, 980, 820, 44);

          // PSYCHOLOGICAL IMPACT
          drawBrutalBox(ctx, 90, 1105, 900, 360, '#FFFFFF', '#000000', 8, 14);
          drawBrutalBox(ctx, 130, 1140, 370, 45, '#FB7185', '#000000', 0, 0);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 22px "Space Grotesk", sans-serif';
          ctx.fillText('🧠 ON-SCREEN PSYCHOLOGY', 150, 1171);

          ctx.fillStyle = '#111317';
          ctx.font = '600 30px "Inter", sans-serif';
          wrapText(ctx, data.impact, 130, 1235, 820, 46);

          // SCRIPT BLUEPRINT
          drawBrutalBox(ctx, 90, 1500, 900, 240, '#FFE600', '#000000', 8, 14);
          drawBrutalBox(ctx, 130, 1535, 360, 45, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#34D399';
          ctx.font = '900 22px "Space Grotesk", sans-serif';
          ctx.fillText('✍️ HOW TO SCRIPT IT (AV)', 150, 1566);

          ctx.fillStyle = '#000000';
          ctx.font = '700 27px "Inter", sans-serif';
          wrapText(ctx, data.scriptCue, 130, 1625, 820, 38);

          // Footer
          ctx.fillStyle = '#000000';
          ctx.font = '800 28px "Space Grotesk", sans-serif';
          ctx.fillText('DRAFTSRUSH STUDIO', 90, 1820);
          ctx.font = '700 26px "JetBrains Mono", monospace';
          ctx.fillText('draftsrush.com', 720, 1820);

        } else if (data.type === "cta") {
          // Slide 8: Closing CTA Conversion Card
          ctx.fillStyle = '#FFE600';
          ctx.fillRect(0, 0, 1080, 1920);
          ctx.lineWidth = 24;
          ctx.strokeStyle = '#000000';
          ctx.strokeRect(0, 0, 1080, 1920);

          drawBrutalBox(ctx, 90, 120, 480, 75, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 24px "Space Grotesk", sans-serif';
          ctx.fillText(data.badge, 120, 166);

          ctx.fillStyle = '#000000';
          ctx.font = '900 32px "JetBrains Mono", monospace';
          ctx.fillText('08 / 08', 860, 166);

          drawBrutalBox(ctx, 90, 240, 900, 1280, '#FFFFFF', '#000000', 10, 24);

          ctx.fillStyle = '#000000';
          ctx.font = '900 78px "Space Grotesk", sans-serif';
          ctx.fillText('STOP SHOOTING', 150, 380);

          drawBrutalBox(ctx, 140, 420, 720, 95, '#FB7185', '#000000', 0, 0);
          ctx.fillStyle = '#FFFFFF';
          ctx.fillText('RANDOM ANGLES.', 160, 492);

          ctx.fillStyle = '#111317';
          ctx.font = '600 36px "Inter", sans-serif';
          wrapText(ctx, data.deck, 150, 590, 780, 54);

          drawBrutalBox(ctx, 150, 820, 780, 310, '#D6E4EE', '#000000', 6, 12);
          ctx.fillStyle = '#000000';
          ctx.font = '900 34px "Space Grotesk", sans-serif';
          ctx.fillText(data.boxTitle, 190, 890);

          ctx.fillStyle = '#222222';
          ctx.font = '600 28px "Inter", sans-serif';
          wrapText(ctx, data.boxText, 190, 950, 700, 42);

          drawBrutalBox(ctx, 150, 1180, 780, 110, '#000000', '#000000', 0, 0);
          ctx.fillStyle = '#34D399';
          ctx.font = '900 36px "Space Grotesk", sans-serif';
          ctx.fillText(data.btn1, 180, 1250);

          drawBrutalBox(ctx, 150, 1320, 780, 110, '#FFE600', '#000000', 6, 8);
          ctx.fillStyle = '#000000';
          ctx.font = '900 36px "Space Grotesk", sans-serif';
          ctx.fillText(data.btn2, 240, 1390);

          ctx.fillStyle = '#000000';
          ctx.font = '800 32px "Space Grotesk", sans-serif';
          ctx.fillText('DRAFTSRUSH STUDIO • 2026', 90, 1780);
        }
      });
    }

    function downloadSingle(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    async function downloadAll() {
      const zip = new JSZip();
      canvases.forEach((canvas, idx) => {
        const dataUrl = canvas.toDataURL('image/png');
        const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
        const filename = idx === 0 ? 'cinematography-00-intro.png' : (idx === 7 ? 'cinematography-07-cta.png' : `cinematography-0${idx}-rule.png`);
        zip.file(filename, base64Data, { base64: true });
      });

      const content = await zip.generateAsync({ type: "blob" });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = "draftsrush-photo-annotated-reel.zip";
      link.click();
    }

    // Preload all remote photos with CORS anonymous flag
    let loadCount = 0;
    const photoUrls = rulesData.filter(d => d.imgUrl).map(d => d.imgUrl);

    photoUrls.forEach(url => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        loadedImages[url] = img;
        loadCount++;
        if (loadCount === photoUrls.length) {
          renderAll();
        }
      };
      img.onerror = () => {
        loadCount++;
        if (loadCount === photoUrls.length) {
          renderAll();
        }
      };
      img.src = url;
    });

    document.fonts.ready.then(() => {
      if (photoUrls.length === 0) renderAll();
    });
  </script>
</body>
