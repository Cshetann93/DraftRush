<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DraftsRush - Myth vs Reality Intro Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111317;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header-panel {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      color: #FFE600;
      font-size: 26px;
      margin-bottom: 6px;
    }
    p {
      color: #D6E4EE;
      font-size: 14px;
      margin-bottom: 16px;
    }
    canvas {
      width: 100%;
      max-width: 360px;
      height: auto;
      aspect-ratio: 9 / 16;
      border: 3px solid #000000;
      display: block;
      margin-bottom: 16px;
      background: #FFE600;
    }
    .btn-download {
      background: #FFE600;
      color: #000000;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 15px;
      padding: 12px 24px;
      border: 3px solid #000000;
      box-shadow: 4px 4px 0px #FFFFFF;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-download:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #FFFFFF;
    }
    .btn-download:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #FFFFFF;
    }
  </style>
</head>
<body>

  <div class="header-panel">
    <h1>Reel Intro Title Card (1080x1920)</h1>
    <p>Opening Hook Frame for the Myth vs Reality Series</p>
    <button class="btn-download" onclick="downloadIntro()">Download Intro Frame PNG</button>
  </div>

  <canvas id="introCanvas" width="1080" height="1920"></canvas>

  <script>
    const canvas = document.getElementById('introCanvas');
    const ctx = canvas.getContext('2d');

    function drawBrutalBox(ctx, x, y, w, h, fill, border = '#000000', borderWidth = 8, shadow = 16) {
      if (shadow > 0) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(x + shadow, y + shadow, w, h);
      }
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = border;
      ctx.lineWidth = borderWidth;
      ctx.strokeRect(x, y, w, h);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    function renderIntro() {
      // Background: Electric Yellow Canvas
      ctx.fillStyle = '#FFE600';
      ctx.fillRect(0, 0, 1080, 1920);
      ctx.lineWidth = 24;
      ctx.strokeStyle = '#000000';
      ctx.strokeRect(0, 0, 1080, 1920);

      // Top Tag Bar
      drawBrutalBox(ctx, 90, 140, 480, 75, '#000000', '#000000', 0, 0);
      ctx.fillStyle = '#34D399';
      ctx.beginPath();
      ctx.arc(130, 177, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 24px "Space Grotesk", sans-serif';
      ctx.fillText('VIDEO SCRIPT PROTOCOL', 155, 186);

      // Main Brutalist Container Card
      drawBrutalBox(ctx, 90, 260, 900, 1340, '#FFFFFF', '#000000', 10, 22);

      // Small Category Pill
      drawBrutalBox(ctx, 150, 330, 360, 60, '#E2E4E9', '#000000', 4, 6);
      ctx.fillStyle = '#111317';
      ctx.font = '800 22px "Space Grotesk", sans-serif';
      ctx.fillText('CONTENT BOTTLENECK', 180, 368);

      // Headline Word 1: MYTH (Red/Pink Accent Box)
      drawBrutalBox(ctx, 150, 430, 780, 200, '#FB7185', '#000000', 8, 16);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 140px "Space Grotesk", sans-serif';
      ctx.fillText('MYTH', 320, 580);

      // Divider Pill: VS
      drawBrutalBox(ctx, 450, 660, 180, 80, '#000000', '#FFE600', 6, 10);
      ctx.fillStyle = '#FFE600';
      ctx.font = '900 44px "Space Grotesk", sans-serif';
      ctx.fillText('VS', 510, 718);

      // Headline Word 2: REALITY (Electric Yellow Box)
      drawBrutalBox(ctx, 150, 770, 780, 200, '#FFE600', '#000000', 8, 16);
      ctx.fillStyle = '#000000';
      ctx.font = '900 135px "Space Grotesk", sans-serif';
      ctx.fillText('REALITY', 240, 920);

      // Clarifying Deck Text
      ctx.fillStyle = '#111317';
      ctx.font = '700 38px "Inter", sans-serif';
      const deckText = "9 production truths about scriptwriting, pacing, and retention that creators get wrong.";
      wrapText(ctx, deckText, 150, 1060, 780, 56);

      // Sub-box: Audience Notice
      drawBrutalBox(ctx, 150, 1260, 780, 260, '#D6E4EE', '#000000', 6, 10);
      ctx.fillStyle = '#000000';
      ctx.font = '900 26px "Space Grotesk", sans-serif';
      ctx.fillText('WHY VIDEOS ACTUALLY STALL', 190, 1320);

      ctx.fillStyle = '#222222';
      ctx.font = '600 24px "Inter", sans-serif';
      wrapText(ctx, "An idea in your head is not a video script. When structure fails, viewer retention dies in seconds.", 190, 1370, 700, 38);

      // Bottom Call-to-Action Strip
      drawBrutalBox(ctx, 90, 1660, 900, 110, '#000000', '#000000', 0, 0);
      ctx.fillStyle = '#FFE600';
      ctx.font = '900 32px "Space Grotesk", sans-serif';
      ctx.fillText('BLUEPRINTS BY DRAFTSRUSH.COM', 150, 1728);

      // Arrow on right side of bottom CTA
      ctx.fillStyle = '#34D399';
      ctx.font = '900 34px sans-serif';
      ctx.fillText('→', 910, 1728);
    }

    function downloadIntro() {
      const link = document.createElement('a');
      link.download = 'myth-vs-reality-00-intro.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    document.fonts.ready.then(renderIntro);
  </script>
</body>
</html>
