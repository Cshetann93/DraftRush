<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reel Template Canvas Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@500;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #111317;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      display: flex;
      gap: 32px;
      align-items: flex-start;
      justify-content: center;
    }
    .panel {
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    label {
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      font-weight: 700;
      color: #FFE600;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      background: #1F232B;
      border: 2px solid #000;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    textarea { height: 110px; resize: vertical; }
    .btn-group { display: flex; gap: 10px; }
    button {
      flex: 1;
      padding: 12px;
      background: #FFE600;
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      border: 2px solid #000;
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.1s;
    }
    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }
    .canvas-container {
      border: 4px solid #000;
      box-shadow: 8px 8px 0 #FFE600;
      line-height: 0;
    }
    canvas {
      width: 360px;
      height: 640px; /* Scaled down 1/3 display size; exports full 1080x1920 */
      background: #000;
    }
  </style>
</head>
<body>

  <div class="panel">
    <h2 style="font-family: 'Space Grotesk'; margin: 0; text-transform: uppercase;">Reel Slide Maker</h2>
    
    <div>
      <label>Template Style</label>
      <select id="tplSelect">
        <option value="brutalist">Template 1: Brutalist Card</option>
        <option value="terminal">Template 2: Dark Terminal</option>
      </select>
    </div>

    <div>
      <label>Step Number / Badge</label>
      <input type="text" id="badgeText" value="01 / 07">
    </div>

    <div>
      <label>Category / Tagline</label>
      <input type="text" id="catText" value="CREATOR STRATEGY">
    </div>

    <div>
      <label>Main Title</label>
      <input type="text" id="titleText" value="Reddit Horror Stories">
    </div>

    <div>
      <label>Body Bullets (Enter separated)</label>
      <textarea id="bodyText">Source top text posts from r/nosleep.
Overlay text onto free royalty-free gameplay.
Add auto-captions in CapCut.
Viewers stay to read the ending.</textarea>
    </div>

    <div>
      <label>Bottom Tool Highlight</label>
      <input type="text" id="footerText" value="TOOLS: REDDIT + CAPCUT (FREE)">
    </div>

    <div class="btn-group">
      <button id="downloadBtn">Download PNG</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="reelCanvas" width="1080" height="1920"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('reelCanvas');
    const ctx = canvas.getContext('2d');

    const tplSelect = document.getElementById('tplSelect');
    const badgeText = document.getElementById('badgeText');
    const catText = document.getElementById('catText');
    const titleText = document.getElementById('titleText');
    const bodyText = document.getElementById('bodyText');
    const footerText = document.getElementById('footerText');
    const downloadBtn = document.getElementById('downloadBtn');

    function drawHardBox(x, y, w, h, fill, shadowOffset = 14) {
      ctx.fillStyle = '#111317';
      ctx.fillRect(x + shadowOffset, y + shadowOffset, w, h);
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, w, h);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#111317';
      ctx.strokeRect(x, y, w, h);
    }

    function renderBrutalist() {
      // Background
      ctx.fillStyle = '#E2E4E9';
      ctx.fillRect(0, 0, 1080, 1920);

      // Outer safety border
      ctx.lineWidth = 16;
      ctx.strokeStyle = '#111317';
      ctx.strokeRect(40, 40, 1000, 1840);

      // Top Header Block
      drawHardBox(90, 160, 900, 140, '#FFE600', 10);
      
      // Category Text
      ctx.fillStyle = '#111317';
      ctx.font = '900 36px "Space Grotesk"';
      ctx.fillText(catText.value.toUpperCase(), 130, 245);

      // Badge in header
      ctx.fillStyle = '#111317';
      ctx.fillRect(800, 185, 160, 90);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 32px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.fillText(badgeText.value, 880, 242);
      ctx.textAlign = 'left';

      // Main Card Body
      drawHardBox(90, 370, 900, 1260, '#FFFFFF', 16);

      // Title
      ctx.fillStyle = '#111317';
      ctx.font = '900 58px "Space Grotesk"';
      wrapText(titleText.value, 150, 490, 780, 72);

      // Divider line
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#111317';
      ctx.beginPath();
      ctx.moveTo(150, 610);
      ctx.lineTo(930, 610);
      ctx.stroke();

      // Bullets
      ctx.fillStyle = '#22252A';
      ctx.font = '500 40px "Inter"';
      const lines = bodyText.value.split('\n');
      let currentY = 700;
      lines.forEach(line => {
        if (!line.trim()) return;
        ctx.fillStyle = '#FFE600';
        ctx.fillRect(150, currentY - 26, 12, 32);
        ctx.fillStyle = '#22252A';
        wrapText(line, 180, currentY, 740, 56);
        currentY += 120;
      });

      // Bottom Highlight Box
      drawHardBox(150, 1420, 780, 120, '#FFF6CF', 8);
      ctx.fillStyle = '#111317';
      ctx.font = '700 28px "JetBrains Mono"';
      ctx.fillText(footerText.value.toUpperCase(), 180, 1492);
    }

    function renderTerminal() {
      // Dark Base
      ctx.fillStyle = '#111317';
      ctx.fillRect(0, 0, 1080, 1920);

      // Outer window box
      drawHardBox(80, 180, 920, 1560, '#1E232B', 14);

      // Window Header Bar
      ctx.fillStyle = '#D6E4EE';
      ctx.fillRect(80, 180, 920, 90);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#111317';
      ctx.strokeRect(80, 180, 920, 90);

      // Window control dots
      const dots = ['#FF5F56', '#FFBD2E', '#27C93F'];
      dots.forEach((color, i) => {
        ctx.beginPath();
        ctx.arc(130 + (i * 35), 225, 12, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#000';
        ctx.stroke();
      });

      // Header text
      ctx.fillStyle = '#111317';
      ctx.font = '700 28px "JetBrains Mono"';
      ctx.textAlign = 'right';
      ctx.fillText(badgeText.value, 950, 235);
      ctx.textAlign = 'left';

      // Title
      ctx.fillStyle = '#FFE600';
      ctx.font = '900 64px "Space Grotesk"';
      wrapText(titleText.value, 140, 390, 800, 78);

      // Subheading / Tagline
      ctx.fillStyle = '#8FA0B5';
      ctx.font = '700 28px "JetBrains Mono"';
      ctx.fillText(`// ${catText.value.toUpperCase()}`, 140, 480);

      // Code / Bullet points
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '500 38px "Inter"';
      const lines = bodyText.value.split('\n');
      let currentY = 600;
      lines.forEach((line, idx) => {
        if (!line.trim()) return;
        ctx.fillStyle = '#34D399';
        ctx.font = '700 34px "JetBrains Mono"';
        ctx.fillText(`0${idx + 1} >`, 140, currentY);

        ctx.fillStyle = '#F0F2F5';
        ctx.font = '500 38px "Inter"';
        wrapText(line, 240, currentY, 700, 54);
        currentY += 130;
      });

      // Bottom footer bar
      ctx.fillStyle = '#111317';
      ctx.fillRect(140, 1540, 800, 90);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#FFE600';
      ctx.strokeRect(140, 1540, 800, 90);

      ctx.fillStyle = '#FFE600';
      ctx.font = '700 26px "JetBrains Mono"';
      ctx.fillText(footerText.value, 180, 1595);
    }

    function wrapText(text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (tplSelect.value === 'brutalist') {
        renderBrutalist();
      } else {
        renderTerminal();
      }
    }

    [tplSelect, badgeText, catText, titleText, bodyText, footerText].forEach(el => {
      el.addEventListener('input', render);
    });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `${titleText.value.toLowerCase().replace(/[^a-z0-9]/g, '-')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    document.fonts.ready.then(render);
  </script>
</body>
</html>
