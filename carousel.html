<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DraftsRush X Banner Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #111317;
      color: white;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    canvas {
      width: 1000px;
      max-width: 100%;
      height: auto;
      border: 4px solid #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 24px;
    }
    button {
      background: #FFE600;
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 900;
      padding: 14px 28px;
      border: 3px solid #000;
      box-shadow: 4px 4px 0px #fff;
      cursor: pointer;
    }
    button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #fff;
    }
  </style>
</head>
<body>

  <canvas id="xBanner" width="1500" height="500"></canvas>
  <button onclick="downloadBanner()">Download 1500x500 PNG for X</button>

  <script>
    const canvas = document.getElementById('xBanner');
    const ctx = canvas.getContext('2d');

    function draw() {
      // Background
      ctx.fillStyle = '#FFE600';
      ctx.fillRect(0, 0, 1500, 500);

      // Outer Border
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 16;
      ctx.strokeRect(0, 0, 1500, 500);

      // Helper function for Brutalist Box
      function drawBox(x, y, w, h, fill, border = '#000000', borderWidth = 4, shadow = 8) {
        if (shadow > 0) {
          ctx.fillStyle = '#000000';
          ctx.fillRect(x + shadow, y + shadow, w, h);
        }
        ctx.fillStyle = fill;
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = border;
        ctx.lineWidth = borderWidth;
        ctx.strokeRect(x, y, w, h);
      }

      // Top Tag
      drawBox(80, 50, 360, 46, '#000000', '#000000', 0, 0);
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(106, 73, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 18px "Space Grotesk", sans-serif';
      ctx.fillText('INDEPENDENT WRITING STUDIO', 126, 79);

      // Main Center-Right Headline (Safe from bottom-left avatar cutout)
      ctx.fillStyle = '#000000';
      ctx.font = '900 58px "Space Grotesk", sans-serif';
      ctx.fillText('RETENTION-ENGINEERED', 80, 160);
      ctx.fillText('VIDEO SCRIPTS & BLUEPRINTS', 80, 225);

      // Sub-headline Banner
      drawBox(80, 255, 870, 52, '#FFFFFF', '#000000', 4, 6);
      ctx.fillStyle = '#111317';
      ctx.font = '700 21px "Inter", sans-serif';
      ctx.fillText('Dual-Column AV Layouts • Verified Research • 24-48h Delivery Turnaround', 105, 288);

      // Feature Specification Badges
      const badges = [
        { text: 'YouTube & Essays', fill: '#FFF6CF' },
        { text: 'Shorts & Reels Packs', fill: '#D6E4EE' },
        { text: 'Free Creator Utilities', fill: '#FFFFFF' }
      ];

      badges.forEach((b, i) => {
        const xPos = 80 + (i * 260);
        drawBox(xPos, 340, 240, 48, b.fill, '#000000', 3, 5);
        ctx.fillStyle = '#000000';
        ctx.font = '700 16px "Space Grotesk", sans-serif';
        ctx.fillText(b.text, xPos + 22, 370);
      });

      // Right-Side Brutalist Anchor Card
      drawBox(1060, 50, 360, 400, '#FFFFFF', '#000000', 6, 12);

      // Studio Label Inside Card
      drawBox(1100, 85, 280, 40, '#000000', '#000000', 0, 0);
      ctx.fillStyle = '#FFE600';
      ctx.font = '900 18px "Space Grotesk", sans-serif';
      ctx.fillText('START WITH A WORKING DEMO', 1120, 111);

      ctx.fillStyle = '#111317';
      ctx.font = '600 18px "Inter", sans-serif';
      ctx.fillText('Send 1 topic or rough idea.', 1100, 175);
      ctx.fillText('Get a demo hook & scene structure', 1100, 205);
      ctx.fillText('to test our pacing first.', 1100, 235);

      // CTA Button
      drawBox(1100, 280, 280, 60, '#FFE600', '#000000', 4, 6);
      ctx.fillStyle = '#000000';
      ctx.font = '900 20px "Space Grotesk", sans-serif';
      ctx.fillText('DM "DEMO" ON X', 1145, 318);

      // Web Link Tag
      ctx.fillStyle = '#000000';
      ctx.font = '700 18px "JetBrains Mono", monospace';
      ctx.fillText('draftsrush.com', 1170, 405);
    }

    // Wait for fonts to load before drawing to ensure correct typography
    document.fonts.ready.then(draw);

    function downloadBanner() {
      const link = document.createElement('a');
      link.download = 'draftsrush-x-banner-1500x500.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
