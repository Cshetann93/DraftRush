<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Title Truncation & Character Checker | DraftsRush</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .brand-font { font-family: 'Space Grotesk', sans-serif; }
    .brutal-box { box-shadow: 4px 4px 0px #111317; }
    .brutal-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #111317; }
  </style>
</head>
<body class="bg-[#E2E4E9] text-[#111317] min-h-screen flex flex-col antialiased selection:bg-[#FFE600] selection:text-black">
  <header class="border-b-4 border-black bg-[#FFE600] p-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="../index" class="text-2xl font-black brand-font flex items-center gap-2">
        <span class="bg-black text-white px-2 py-0.5 border-2 border-black rotate-[-2deg]">DR</span> DraftsRush
      </a>
      <a href="../tools" class="font-bold text-sm underline">All Tools</a>
    </div>
  </header>

  <main class="flex-grow max-w-3xl mx-auto px-6 py-12 w-full">
    <div class="border-4 border-black bg-[#F0F2F5] p-6 md:p-8 brutal-box mb-8">
      <span class="bg-black text-white px-2 py-0.5 text-xs font-bold brand-font uppercase">SEO & CTR Utility</span>
      <h1 class="text-3xl md:text-4xl font-black brand-font mt-2 mb-2">YouTube Title Truncation Preview</h1>
      <p class="text-sm font-medium text-gray-700 mb-6">Test if your title cuts off on mobile screens. Mobile feeds cut titles at roughly 50 characters.</p>

      <label class="block font-black text-xs uppercase mb-2">Your Video Title</label>
      <input id="title-input" type="text" placeholder="Type your title here..." class="w-full border-2 border-black p-3 font-medium bg-white focus:bg-[#FFFDE6] mb-6">

      <div class="grid grid-cols-2 gap-4 text-center mb-6">
        <div class="border-2 border-black bg-white p-3 brutal-box">
          <div id="char-count" class="text-3xl font-black brand-font">0</div>
          <p class="text-xs font-bold text-gray-600 uppercase">Characters (Max 100)</p>
        </div>
        <div class="border-2 border-black bg-white p-3 brutal-box">
          <div id="mobile-status" class="text-lg font-black brand-font mt-1">Safe on Mobile</div>
          <p class="text-xs font-bold text-gray-600 uppercase">Mobile Cut-Off</p>
        </div>
      </div>

      <div class="border-2 border-black bg-white p-4 brutal-box">
        <div class="text-xs font-bold text-gray-500 uppercase mb-2">Mobile Feed Preview (~50 chars):</div>
        <div id="preview-box" class="font-bold text-base text-gray-900 border-l-4 border-[#FFE600] pl-3 py-1">Start typing above...</div>
      </div>
    </div>
  </main>

  <script>
    const input = document.getElementById('title-input');
    const charCount = document.getElementById('char-count');
    const mobileStatus = document.getElementById('mobile-status');
    const previewBox = document.getElementById('preview-box');

    input.addEventListener('input', () => {
      const val = input.value;
      const count = val.length;
      charCount.innerText = count;

      if (count > 50) {
        mobileStatus.innerText = 'Cuts Off on Mobile';
        mobileStatus.className = 'text-lg font-black brand-font mt-1 text-red-600';
        previewBox.innerText = val.slice(0, 48) + '...';
      } else {
        mobileStatus.innerText = 'Safe on Mobile';
        mobileStatus.className = 'text-lg font-black brand-font mt-1 text-emerald-700';
        previewBox.innerText = val || 'Start typing above...';
      }
    });
  </script>
</body>
</html>
