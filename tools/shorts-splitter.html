<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Long-Form to Shorts Repurposing Calculator | DraftsRush</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .brand-font { font-family: 'Space Grotesk', sans-serif; }
    .brutal-box { box-shadow: 4px 4px 0px #111317; }
  </style>
</head>
<body class="bg-[#E2E4E9] text-[#111317] min-h-screen flex flex-col antialiased selection:bg-[#FFE600] selection:text-black">
  <header class="border-b-4 border-black bg-[#FFE600] p-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="text-2xl font-black brand-font flex items-center gap-2">
        <span class="bg-black text-white px-2 py-0.5 border-2 border-black rotate-[-2deg]">DR</span> DraftsRush
      </a>
      <a href="../tools.html" class="font-bold text-sm underline">All Tools</a>
    </div>
  </header>

  <main class="flex-grow max-w-3xl mx-auto px-6 py-12 w-full">
    <div class="border-4 border-black bg-[#F0F2F5] p-6 md:p-8 brutal-box mb-8">
      <span class="bg-black text-white px-2 py-0.5 text-xs font-bold brand-font uppercase">Repurposing Calculator</span>
      <h1 class="text-3xl md:text-4xl font-black brand-font mt-2 mb-2">Video Repurposing Calculator</h1>
      <p class="text-sm font-medium text-gray-700 mb-6">Calculate how many standalone 50-second Shorts clips can be carved from your long-form video or podcast transcript.</p>

      <div class="mb-6">
        <label class="block font-black text-xs uppercase mb-2">Long-Form Total Word Count</label>
        <input id="lf-words" type="number" value="1800" min="200" step="100" class="w-full border-2 border-black p-3 font-bold bg-white focus:bg-[#FFFDE6]">
      </div>

      <div class="grid grid-cols-2 gap-4 text-center">
        <div class="border-2 border-black bg-white p-4 brutal-box">
          <div id="shorts-est" class="text-4xl font-black brand-font text-blue-800">14</div>
          <p class="text-xs font-bold text-gray-600 uppercase">Standalone Shorts Potential</p>
        </div>
        <div class="border-2 border-black bg-white p-4 brutal-box">
          <div class="text-4xl font-black brand-font text-black">125</div>
          <p class="text-xs font-bold text-gray-600 uppercase">Words Per 50-Second Clip</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const wordsInput = document.getElementById('lf-words');
    const shortsEst = document.getElementById('shorts-est');

    wordsInput.addEventListener('input', () => {
      const val = parseFloat(wordsInput.value) || 0;
      // 125 words per 50s clip
      const count = Math.floor(val / 125);
      shortsEst.innerText = count > 0 ? count : 0;
    });
  </script>
</body>
</html>
